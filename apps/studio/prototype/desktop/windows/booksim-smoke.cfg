// Deterministic measured simulation used for Windows/Linux numerical parity.
topology = mesh;
k = 2;
n = 2;
routing_function = dim_order;
num_vcs = 2;
vc_buf_size = 4;
traffic = uniform;
injection_rate = 0.02;
packet_size = 1;
sim_type = latency;
sample_period = 1000;
max_samples = 5;
warmup_periods = 1;
seed = 7;
