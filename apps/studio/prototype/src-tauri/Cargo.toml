[package]
name = "srota-studio"
version = "0.1.1"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

# The shipped desktop binary carries no debug symbols and is linked once for
# speed: smaller .deb payload and a shorter cold start.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
