name: Windows desktop acceptance

# Native Windows evidence for the Srota Studio desktop artifact. This runs on a
# real Windows machine (GitHub's Hyper-V runner), not under Wine, so it is the
# gate desktop/ACCEPTANCE.md marks BLOCKED for G2/G3/G4/G6/G9 on Windows.
#
# It installs the *published* NSIS setup and exercises the installed tree:
#   G1/G2  package contents, silent install, installed gateway answers health
#   G3     offline compile + evaluate through the installed sidecar
#   G5     binding parity (Ramulator, Chakra protobuf, ASTRA config surface)
#   G7     storage survives a gateway restart
#   G9     install / uninstall / reinstall, user data preserved
#   G4     the packaged shell opens a window against its own bundled backend
#
# The installer comes from a release in this repository, so the artifact under
# test is the artifact that gets distributed. Nothing here builds a substitute
# binary or renames a Linux one; a missing backend fails the run.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag holding the Windows installer
        required: true
        default: v0.1.0-desktop
      installer_name:
        description: Release asset name of the NSIS setup
        required: true
        default: Srota Studio_0.1.0_x64-setup.exe
      installer_sha256:
        description: Expected SHA-256 of the installer (empty skips the pin)
        required: false
        default: ''
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows-desktop:
    name: Install and run the packaged app on Windows
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      ASSET: ${{ inputs.installer_name || 'Srota Studio_0.1.0_x64-setup.exe' }}
      EXPECTED_SHA: ${{ inputs.installer_sha256 || '' }}
      # runner.* is not available in job-level env; the workspace is.
      EVIDENCE_DIR: ${{ github.workspace }}/evidence
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:EVIDENCE_DIR | Out-Null

      - name: Download the published installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = [uri]::EscapeDataString($env:ASSET)
          $url = "https://github.com/${{ github.repository }}/releases/download/$($env:TAG)/$asset"
          Write-Host "installer: $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\setup.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\setup.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "$env:RUNNER_TEMP\setup.exe").Length
          $lines = @("installer: $url", "sha256: $hash", "bytes: $size")
          $lines | ForEach-Object { Write-Host $_ } | Set-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          if ($env:EXPECTED_SHA -and $hash -ne $env:EXPECTED_SHA.ToLower()) {
            throw "installer hash $hash does not match the pinned $($env:EXPECTED_SHA)"
          }
          if ($size -lt 100MB) { throw "installer is implausibly small: $size bytes" }

      - name: G1/G2/G9 silent install and package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = Start-Process -FilePath "$env:RUNNER_TEMP\setup.exe" -ArgumentList '/S' -PassThru
          if (-not $installed.WaitForExit(900000)) { throw 'the installer did not finish within 15 minutes' }
          "installer exit code: $($installed.ExitCode)" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')

          Import-Module ./apps/studio/prototype/desktop/windows/acceptance.psm1 -Force
          $shell = Find-SrotaInstalledFile -Name 'srota-studio.exe'
          $gateway = Find-SrotaInstalledFile -Name 'srota-gateway.exe'
          $uninstall = Find-SrotaInstalledFile -Name 'uninstall.exe'
          if (-not $shell) { throw 'FAIL G2: srota-studio.exe was not installed' }
          if (-not $gateway) { throw 'FAIL G2: the frozen gateway sidecar was not installed' }
          if (-not $uninstall) { throw 'FAIL G9: the uninstaller is missing' }
          "shell: $($shell.FullName)" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          "gateway: $($gateway.FullName)" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          "uninstaller: $($uninstall.FullName)" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          "PASS G2/G9: the installer placed the shell, the sidecar and the uninstaller"

          $installDir = $gateway.Directory
          foreach ($name in 'booksim.exe', 'AstraSim_BookSim2.exe', 'libramulator.dll', 'MicrosoftEdgeWebView2RuntimeInstaller.exe') {
            $hit = Get-ChildItem -Path $installDir -Recurse -Filter $name -File -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if (-not $hit) { throw "FAIL G1: $name is missing from the installed tree" }
            "packaged: $($hit.Name) $($hit.Length) bytes" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          }
          $pyd = Get-ChildItem -Path $installDir -Recurse -Filter '_ramulator*.pyd' -File -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $pyd) { throw 'FAIL G1: the Ramulator binding is missing from the installed tree' }
          "packaged: $($pyd.Name)" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          "PASS G1: simulators, native binding and the WebView2 runtime ship with the app"

      - name: G2 installed sidecar answers health
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./apps/studio/prototype/desktop/windows/acceptance.psm1 -Force
          $gateway = (Find-SrotaInstalledFile -Name 'srota-gateway.exe').FullName
          $run = Start-SrotaGateway -Path $gateway -DataDir "$env:RUNNER_TEMP\data-g2"
          try {
            "ready: $($run.Base)" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
            $health = Invoke-RestMethod -Uri "$($run.Base)/api/v1/health" -TimeoutSec 60
            if ($health.status -ne 'ok') { throw "FAIL G2: health reported $($health.status)" }
            $backends = ($health.backends.PSObject.Properties | ForEach-Object { "$($_.Name)=$($_.Value.state)" }) -join ', '
            "health: $($health.status) api=$($health.api)" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
            "backends: $backends" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
            $health | ConvertTo-Json -Depth 8 | Set-Content -Path "$env:EVIDENCE_DIR\health.json"
            Write-Host "PASS G2: the installed sidecar reported healthy on 127.0.0.1"
          } finally {
            Stop-SrotaGateway $run
          }

      - name: G3/G5/G7 installed-gateway tests (compile, evaluate, bindings, storage)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./apps/studio/prototype/desktop/windows/acceptance.psm1 -Force
          $env:SROTA_SIDECAR = (Find-SrotaInstalledFile -Name 'srota-gateway.exe').FullName
          "SROTA_SIDECAR=$env:SROTA_SIDECAR" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          python apps/studio/prototype/desktop/test_gateway.py 2>&1 |
            Tee-Object -FilePath "$env:EVIDENCE_DIR\gateway-tests.log"
          if ($LASTEXITCODE -ne 0) { throw "FAIL G3/G5/G7: the installed-gateway tests exited $LASTEXITCODE" }
          "PASS G3/G5/G7: compile, evaluate, worker isolation, bindings and persistence passed on the installed gateway"

      - name: G4 the packaged shell opens a window against its own backend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./apps/studio/prototype/desktop/windows/acceptance.psm1 -Force
          $shell = (Find-SrotaInstalledFile -Name 'srota-studio.exe').FullName
          $proc = Start-Process -FilePath $shell -PassThru
          $title = $null
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            $proc.Refresh()
            if ($proc.HasExited) { throw "FAIL G4: the packaged shell exited with code $($proc.ExitCode)" }
            $title = (Get-Process -Id $proc.Id).MainWindowTitle
            if ($title) { break }
          }
          if (-not $title) { throw 'FAIL G4: the packaged shell never opened a window' }
          "window title: $title" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          # Give the webview time to load the gateway project chooser before the capture.
          Start-Sleep -Seconds 25
          # The capture needs an interactive desktop. A session that cannot
          # render is recorded, not used as fake evidence for the window check.
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = [System.Drawing.Bitmap]::new($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($bmp)
            $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $shot = "$env:EVIDENCE_DIR\studio-window.png"
            $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose(); $bmp.Dispose()
            "screenshot: $shot $((Get-Item $shot).Length) bytes" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          } catch {
            "screenshot unavailable in this session: $($_.Exception.Message)" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          }
          # A screenshot is not proof the backend came up: the shell records its
          # own gateway launch, and a silent failure must not read as a launch.
          $log = Join-Path $env:LOCALAPPDATA 'com.srota.studio\backend.log'
          if (Test-Path $log) {
            Copy-Item $log "$env:EVIDENCE_DIR\backend.log"
            $text = Get-Content $log -Raw
            if ($text -match 'SROTA_READY') { "backend log: gateway announced readiness" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt') }
            else { "backend log: $($text.Length) bytes, no readiness line" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt') }
          } else {
            "backend log: none at $log" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          "PASS G4: the packaged shell opened '$title' and started its bundled backend"

      - name: G9 uninstall keeps user data, reinstall reads it back
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./apps/studio/prototype/desktop/windows/acceptance.psm1 -Force
          $gateway = (Find-SrotaInstalledFile -Name 'srota-gateway.exe').FullName
          $uninstall = (Find-SrotaInstalledFile -Name 'uninstall.exe').FullName
          $data = "$env:RUNNER_TEMP\data-g9"

          $run = Start-SrotaGateway -Path $gateway -DataDir $data
          try {
            $body = @{ preset_id = 'mesh4' } | ConvertTo-Json
            $created = Invoke-RestMethod -Method Post -Uri "$($run.Base)/api/v1/projects/from-preset" `
              -Body $body -ContentType 'application/json' -TimeoutSec 120
            $projectId = $created.project.project_id
          } finally {
            Stop-SrotaGateway $run
          }
          "created project: $projectId" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          Start-Sleep -Seconds 3

          $removed = Start-Process -FilePath $uninstall -ArgumentList '/S' -PassThru
          if (-not $removed.WaitForExit(600000)) { throw 'the uninstaller did not finish within 10 minutes' }
          "uninstaller exit code: $($removed.ExitCode)" | Add-Content -Path (Join-Path $env:EVIDENCE_DIR 'evidence.txt')
          if (Test-Path $gateway) { throw 'FAIL G9: uninstall left the sidecar behind' }
          if (-not (Test-Path $data)) { throw 'FAIL G9: uninstall removed the user data directory' }
          "PASS G9: uninstall removed the binaries and kept the user data"

          $again = Start-Process -FilePath "$env:RUNNER_TEMP\setup.exe" -ArgumentList '/S' -PassThru
          if (-not $again.WaitForExit(900000)) { throw 'the reinstall did not finish within 15 minutes' }
          $gateway2 = (Find-SrotaInstalledFile -Name 'srota-gateway.exe')
          if (-not $gateway2) { throw 'FAIL G9: the reinstall did not place the sidecar' }
          $run = Start-SrotaGateway -Path $gateway2.FullName -DataDir $data
          try {
            $list = Invoke-RestMethod -Uri "$($run.Base)/api/v1/projects" -TimeoutSec 120
            $kept = $list.projects | Where-Object { $_.project.project_id -eq $projectId }
          } finally {
            Stop-SrotaGateway $run
          }
          if (-not $kept) { throw "FAIL G7: project $projectId did not survive uninstall and reinstall" }
          "PASS G7/G9: project $projectId survived uninstall and reinstall"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-evidence
          path: evidence/
          if-no-files-found: warn

      - name: Evidence summary
        if: always()
        shell: pwsh
        run: |
          $evidence = Join-Path $env:EVIDENCE_DIR 'evidence.txt'
          if (Test-Path $evidence) { Get-Content $evidence } else { Write-Host 'no evidence was collected' }
