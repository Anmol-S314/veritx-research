name: VeritX CI

on:
  push:
    branches:
      - main
      - 'pareto-analysis-*'   # Manal's analysis branches
      - 'feature/**'
      - 'fix/**'
      - 'integration/**'      # RT-14: the sealed/closure SHA must get CI
  pull_request:
    branches: [main]
  workflow_dispatch:

# Container pin (RT-14): the toolchain image used to float on `:latest`, so
# the sealed SHA had no reproducible CI environment. The digest below was
# resolved from the registry (`podman pull` -> RepoDigests); bump it
# deliberately via the rebuild-docker job, never silently.
# REQUIREMENT: the image must ship Python >= 3.12. The currently published
# digest ships 3.10, which cannot parse tracks/t3-topology/dse (PEP 701
# f-strings) — the t3 container leg fails at `make lint` until the image is
# rebuilt on a 3.12 base. Fail loudly, do not paper over.

jobs:
  veritx-ci:
    name: ${{ matrix.track }}
    runs-on: ubuntu-latest
    container:
      # anchored digest, reused by every container job below
      image: &veritx-tools-image ghcr.io/anmol-s314/veritx-tools-base@sha256:4018cd4786a4d3d64143e1452a76bffecec26922e92ef9590ff9810f2d344bed
    strategy:
      fail-fast: false
      matrix:
        track: [onboarding, t1-kvcache, t2-deadlock, t3-topology, t4-formal]
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: make -C tracks/${{ matrix.track }} setup
      - name: Lint
        run: make -C tracks/${{ matrix.track }} lint
      - name: Test (sanity)
        run: make -C tracks/${{ matrix.track }} test
      - name: Sim (full)
        if: matrix.track != 'onboarding' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: make -C tracks/${{ matrix.track }} sim
      - name: Timeloop→Booksim spine (T3 only)
        if: matrix.track == 't3-topology' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: make -C tracks/t3-topology timeloop
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.track }}
          path: tracks/${{ matrix.track }}/results/
          retention-days: 30

  report:
    name: Generate Report
    needs: [veritx-ci]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    container:
      image: *veritx-tools-image
    steps:
      - uses: actions/checkout@v4
      - name: Download T1 results
        uses: actions/download-artifact@v4
        with:
          name: t1-kvcache
          path: tracks/t1-kvcache/results/
        continue-on-error: true
      - name: Download T2 results
        uses: actions/download-artifact@v4
        with:
          name: t2-deadlock
          path: tracks/t2-deadlock/results/
        continue-on-error: true
      - name: Download T3 results
        uses: actions/download-artifact@v4
        with:
          name: t3-topology
          path: tracks/t3-topology/results/
        continue-on-error: true
      - name: Download T4 results
        uses: actions/download-artifact@v4
        with:
          name: t4-formal
          path: tracks/t4-formal/results/
        continue-on-error: true
      - name: Pull tools image
        run: docker pull ghcr.io/anmol-s314/veritx-tools-base@sha256:4018cd4786a4d3d64143e1452a76bffecec26922e92ef9590ff9810f2d344bed
      - name: Generate report
        run: make report
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: report/
          retention-days: 90

  dashboard-t3:
    name: T3 Dashboard
    needs: [veritx-ci]
    if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest        # plain runner — generator is pure python3, no tools needed
    permissions:
      contents: write             # to push the built page to gh-pages
    steps:
      - uses: actions/checkout@v4
      - name: Download T3 results
        uses: actions/download-artifact@v4
        with:
          name: t3-topology
          path: tracks/t3-topology/results/
        continue-on-error: true
      - name: Restore history from gh-pages
        run: |
          git fetch origin gh-pages --depth=1 2>/dev/null \
            && git show origin/gh-pages:t3/history.json > tracks/t3-topology/results/history.json 2>/dev/null \
            || echo "no existing history yet (first run)"
      - name: Generate dashboard
        run: python3 tracks/t3-topology/scripts/generate_dashboard.py
      - name: Stage site
        run: |
          mkdir -p public/t3
          cp report/t3/index.html public/t3/
          cp tracks/t3-topology/results/history.json public/t3/ 2>/dev/null || true
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true          # preserve other tracks' pages

  # Verified-PRD Integrity PR A (§11.4): a compatibility claim requires CI
  # evidence. The container job pins one Python; this matrix actually tests
  # the declared >=3.12 floor on real interpreters — the job that would have
  # caught the uuid.uuid7-on-3.13 defect.
  pr-a-environment:
    name: PR A env matrix (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install from declared metadata only
        run: pip install -e tracks/t3-topology/dse
      - name: Focused core tests
        run: |
          python -m pytest tracks/t3-topology/dse/tests/test_environment_contract.py -q
          python -m pytest tracks/t3-topology/dse/tests/test_run_core.py -q
          python -m pytest tracks/t3-topology/dse/tests/test_slice_a_booksim.py -q

  # RT-5b / closure gate 10: the Studio fixtures must be reproducible by the
  # engine, not merely schema-valid. This runs on a plain runner because the
  # pinned tools container still ships Python 3.10, which cannot parse the
  # DSE sources (PEP 701 f-strings). BookSim is built from the vendored tree
  # (the same qualified producer the fixtures were generated from); the
  # validator regenerates all five fixtures into a temp dir, proves the
  # EVALUATED fixture + RequirementReport + CERTIFIED_PRODUCT study through
  # engine objects, and compares BYTES byte-for-byte (C-4). The two evaluated
  # fixtures currently differ only by a reported engine defect (runtime
  # evidence provenance leaking into contract identities), so the provisioned
  # step fails loudly with ENGINE DEFECT (REPORTED, NOT NORMALIZED) rather
  # than blessing a normalized comparison.
  # Guarded on the Studio tree existing so refs that predate P1 (e.g. main)
  # skip it instead of failing.
  studio-fixtures:
    name: Studio fixtures (engine realizability)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Studio tree
        id: studio
        run: |
          if [ -f apps/studio/scripts/validate_fixtures.py ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::apps/studio not present on this ref — skipping engine realizability gate"
          fi
      - uses: actions/setup-python@v5
        if: steps.studio.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install engine + validator deps
        if: steps.studio.outputs.present == 'true'
        run: |
          pip install -e "tracks/t3-topology/dse[dev]"
          pip install jsonschema
      - name: Build BookSim (qualified producer)
        if: steps.studio.outputs.present == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex
          make -C third_party/booksim2/src -j"$(nproc)"
      - name: Fast path + C-6 required tests
        if: steps.studio.outputs.present == 'true'
        run: |
          python3 apps/studio/scripts/validate_fixtures.py --skip-engine
          python3 -m pytest apps/studio/tests -q
      - name: Provisioned backend proof + byte-for-byte reproducibility
        if: steps.studio.outputs.present == 'true'
        run: python3 apps/studio/scripts/validate_fixtures.py --engine

  rebuild-docker:
    name: Rebuild Docker Image
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/anmol-s314/veritx-tools-base:latest
          # NOTE (RT-14): pushing a new :latest does NOT move the pinned
          # digest above; update the pin in this file in the same change.
