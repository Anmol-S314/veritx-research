# VeritX Research — GitLab CI (mirror of .github/workflows/ci.yml)
# Jobs run inside the prebuilt tools image, so the GitLab runner must use a
# docker/container executor (a shell executor can't pull `image:`).
# CI_REGISTRY_IMAGE is injected by GitLab and is BY CONSTRUCTION this project's
# registry path — never hand-write the registry host here. A hardcoded guess is
# how the image address can be wrong while every job still looks green until the
# push fails (or, worse, silently keeps pulling a stale image).
variables:
  DOCKER_IMAGE: ${CI_REGISTRY_IMAGE}/veritx-tools-base:latest

default:
  image: ${DOCKER_IMAGE}

stages:
  - test
  - sim
  - dashboard
  - report
  - build

# Full runs only on main pushes or manual (web) runs — matches the GitHub gate.
.on_main:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# --- matrix: one cell per track — setup / lint / test (the gate, every push) ---
ci:
  stage: test
  parallel:
    matrix:
      - TRACK: [onboarding, t1-kvcache, t2-deadlock, t3-topology, t4-formal]
  script:
    - make -C tracks/${TRACK} setup
    - make -C tracks/${TRACK} lint
    - make -C tracks/${TRACK} test
  artifacts:
    paths:
      - tracks/${TRACK}/results/
    expire_in: 7 days

# --- full experiment runs (main / manual) ---
sim-t2-deadlock:
  extends: .on_main
  stage: sim
  needs: ["ci: [t2-deadlock]"]
  script:
    - make -C tracks/t2-deadlock sim
  artifacts:
    paths:
      - tracks/t2-deadlock/results/
    expire_in: 30 days

sim-t3-topology:
  extends: .on_main
  stage: sim
  needs: ["ci: [t3-topology]"]
  script:
    - make -C tracks/t3-topology timeloop    # full spine: Timeloop -> traffic matrix -> sweep
    - make -C tracks/t3-topology energy
  artifacts:
    paths:
      - tracks/t3-topology/results/
    expire_in: 30 days

sim-t4-formal:
  extends: .on_main
  stage: sim
  needs: ["ci: [t4-formal]"]
  script:
    - make -C tracks/t4-formal sim
  artifacts:
    paths:
      - tracks/t4-formal/results/
    expire_in: 30 days
# (t1-kvcache: gem5 build deferred — no sim job yet)

# --- T3 dashboard — kept as a private artifact (not a public URL; IP rule) ---
dashboard-t3:
  extends: .on_main
  stage: dashboard
  needs: ["sim-t3-topology"]
  script:
    - make -C tracks/t3-topology dashboard
  artifacts:
    paths:
      - report/t3/
    expire_in: 90 days

# --- aggregate cross-track report ---
report:
  extends: .on_main
  stage: report
  needs:
    - job: sim-t2-deadlock
      optional: true
    - job: sim-t3-topology
      optional: true
    - job: sim-t4-formal
      optional: true
  script:
    - make report
  artifacts:
    paths:
      - report/
    expire_in: 90 days

# --- rebuild the tools image (needs a docker executor) ---
#
# Logs in to the registry it actually PUSHES to. It used to `docker login ghcr.io`
# and then push to ${DOCKER_IMAGE} on internal-devrepo — authenticating to one
# registry does not authenticate the other, so the push always failed with
# `denied`. GitLab injects CI_REGISTRY_* for its own registry; no manual token.
#
# Runs AUTOMATICALLY when the image inputs change. Manual-only was how a Dockerfile
# change could be merged while every job kept silently running the old image — and
# a stale image does not fail loudly, it fabricates (Accelergy's dummy estimator
# answers 1 um^2 to everything). The tools image must not be able to drift behind
# the Dockerfile that defines it.
rebuild-docker-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t ${DOCKER_IMAGE} .
    - docker push ${DOCKER_IMAGE}
  rules:
    # image inputs changed on main -> rebuild, or every later job runs a stale image
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - Dockerfile
        - tracks/t3-topology/booksim-ext/**/*
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
