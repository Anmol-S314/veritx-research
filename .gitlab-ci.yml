# VeritX Research — GitLab CI (mirror of .github/workflows/ci.yml)
# Jobs run inside the prebuilt tools image, so the GitLab runner must use a
# docker/container executor (a shell executor can't pull `image:`).
# CI_REGISTRY_IMAGE is injected by GitLab and is BY CONSTRUCTION this project's
# registry path — never hand-write the registry host here. A hardcoded guess is
# how the image address can be wrong while every job still looks green until the
# push fails (or, worse, silently keeps pulling a stale image).
variables:
  DOCKER_REPO: ${CI_REGISTRY_IMAGE}/veritx-tools-base
  # Jobs run the shared `:latest` toolchain image. It is NOT rebuilt per commit —
  # the toolchain only changes when the Dockerfile does (see build-image). Normal
  # commits just pull the existing `:latest`.
  DOCKER_IMAGE: ${DOCKER_REPO}:latest

default:
  image: ${DOCKER_IMAGE}

# The toolchain image is a heavy, slow-changing artifact, so it is built ONLY
# when its definition (the Dockerfile) changes — not on every commit. A normal
# research/docs commit skips the build stage entirely and just pulls the existing
# `:latest`. The image can also be built and pushed by hand from a dev box, which
# is the nicer path for a big rebuild since it doesn't tax the CI runner's disk.
stages:
  - build
  - test
  - sim
  - dashboard
  - report
  - site

# Full runs only on main pushes or manual (web) runs — matches the GitHub gate.
.on_main:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# --- matrix: one cell per track — setup / lint / test (the gate, every push) ---
ci:
  stage: test
  parallel:
    matrix:
      # t4-formal temporarily dropped — its tools (Yosys/CBMC) are disabled in
      # the Dockerfile to speed builds. Re-add when the formal track resumes.
      - TRACK: [onboarding, t1-kvcache, t2-deadlock, t3-topology]
  script:
    - make -C tracks/${TRACK} setup
    - make -C tracks/${TRACK} lint
    - make -C tracks/${TRACK} test
  artifacts:
    paths:
      - tracks/${TRACK}/results/
    expire_in: 7 days

# --- full experiment runs (main / manual) ---
sim-t2-deadlock:
  extends: .on_main
  stage: sim
  needs: ["ci: [t2-deadlock]"]
  script:
    - make -C tracks/t2-deadlock sim
  artifacts:
    paths:
      - tracks/t2-deadlock/results/
    expire_in: 30 days

sim-t3-topology:
  extends: .on_main
  stage: sim
  needs: ["ci: [t3-topology]"]
  script:
    - make -C tracks/t3-topology timeloop    # full spine: Timeloop -> traffic matrix -> sweep
    - make -C tracks/t3-topology energy
    - make -C tracks/t3-topology planes      # plane separation: DMA vs control (FlooNoC claim)
  artifacts:
    paths:
      - tracks/t3-topology/results/
    expire_in: 30 days

# sim-t4-formal temporarily disabled (Yosys/CBMC removed from the image for speed):
# sim-t4-formal:
#   extends: .on_main
#   stage: sim
#   needs: ["ci: [t4-formal]"]
#   script:
#     - make -C tracks/t4-formal sim
#   artifacts:
#     paths:
#       - tracks/t4-formal/results/
#     expire_in: 30 days
# (t1-kvcache: gem5 build deferred — no sim job yet)

# --- T3 dashboard — kept as a private artifact (not a public URL; IP rule) ---
dashboard-t3:
  extends: .on_main
  stage: dashboard
  needs: ["sim-t3-topology"]
  script:
    - make -C tracks/t3-topology dashboard
  artifacts:
    paths:
      - report/t3/
    expire_in: 90 days

# --- aggregate cross-track report ---
report:
  extends: .on_main
  stage: report
  needs:
    - job: sim-t2-deadlock
      optional: true
    - job: sim-t3-topology
      optional: true
    - job: sim-t4-formal
      optional: true
  script:
    - make report
  artifacts:
    paths:
      - report/
    expire_in: 90 days

# --- front-facing site: validate every commit, publish on main ---
# The site is the public storefront for Interconnect Credibility Services
# (docs/business/validation-services.md). check_site.py needs only the stdlib,
# so this job does not need the tools image — but it reuses it to keep every
# job on one runtime.
site-check:
  stage: site
  script:
    - python3 scripts/check_site.py site/

site-publish:
  extends: .on_main
  stage: site
  needs: ["site-check"]
  script:
    - python3 scripts/check_site.py site/
  artifacts:
    paths:
      - site/
    expire_in: 90 days

# --- STAGE 1: build this commit's image (needs a docker executor) ---
#
# Runs on EVERY pipeline, not only when the Dockerfile changed. That sounds
# wasteful and mostly isn't: --cache-from reuses every unchanged layer, so an
# untouched Dockerfile is a pull plus a few seconds, and a Booksim-only edit
# rebuilds just the last layer (26s locally). What it buys is that no job can
# ever run an image that isn't the one its own commit describes — which was
# exactly the hole. Conditional rebuilds are how a branch tests the wrong image.
#
# Logs in to the registry it actually PUSHES to. It used to `docker login ghcr.io`
# and then push to the internal registry — authenticating to one registry does not
# authenticate the other, so the push always failed with `denied`. GitLab injects
# CI_REGISTRY_* for its own registry; no manual token.
build-image:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: "1"
    # Don't attach provenance/SBOM attestations. They turn the image into an OCI
    # manifest LIST that the self-hosted registry rejects on push ("error from
    # registry: unknown error"). We want a plain single-image manifest.
    BUILDX_NO_DEFAULT_ATTESTATIONS: "1"
  # Build ONLY when the toolchain definition changes, or on a manual run. Every
  # other pipeline skips this job and reuses the `:latest` already in the registry.
  rules:
    - changes:
        - Dockerfile
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker pull ${DOCKER_REPO}:latest || echo "no latest yet — first build, no cache"
    # BUILDKIT_INLINE_CACHE bakes the layer metadata INTO the pushed image, which
    # is what lets the next pipeline's --cache-from actually hit. Without it the
    # cache silently never applies and every build is a cold 22-minute one.
    - docker build
        --cache-from ${DOCKER_REPO}:latest
        --build-arg BUILDKIT_INLINE_CACHE=1
        --label org.opencontainers.image.revision=${CI_COMMIT_SHA}
        -t ${DOCKER_REPO}:latest .
    - docker push ${DOCKER_REPO}:latest

# Note: no separate "promote" job. build-image pushes `:latest` directly, and it
# only runs when the Dockerfile changes (or manually), so `:latest` moves rarely
# and on purpose. If you want a build tested before it becomes `:latest`, build a
# throwaway tag by hand, run the suite against it, then push `:latest`.
