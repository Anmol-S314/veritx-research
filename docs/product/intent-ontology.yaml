    order: 11
    depends_on: [SYSTEM, PARALLELISM, WORKLOAD, COMMUNICATION_INTENT, FABRIC_INTENT, MEMORY_INTENT, PHYSICAL, PLACEMENT_INTENT, ROUTER_RESOURCE_INTENT]
