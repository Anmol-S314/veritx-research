# intent-ontology.yaml — the Design/Intent model, machine-readable.
#
# This file is the single source of truth for what the Studio Design page
# may render. It is the machine form of docs/product/INTENT-ONTOLOGY.md
# §2.12. scripts/check_intent_ontology.py fails closed against it.
#
# Answer keys (the ten questions), one per node:
#   real        R2 consumed | R1 parsed/inert | R3 refused | R4 derived | R0 absent
#   owner       PRD product | CI compiler-intent | CAND candidate | DER derivation
#               | EXE execution/evidence | OPT optimization
#   edit        TCU type+contract+UI | TC- type+contract no UI | T-- type only | --- none
#   kind        CMT commitment | PRF preference (has default) | META authoring
#               | RED redundant | INERT | DERIVED
#   stored      canonical object that stores it
#   depends_on  immediate dependents
#   invalidates A identity-only | B fabric | C judgement | D refusal | E global pin
#   validation  L1n node parse | L1d document parse | L2 identity/pin
#               | L3d doc-computable at compile | L3x derivation-only
#               | L4 verification | L5 report
#   unsupported null, or the stage that refuses it
#   visual      1 declaration control | 2 derived value | 3 refusal | 4 absence
#               | 5 identity | 6 change class
#   evidence    V read at the call site (required) | I inferred from a consumer list
#   cite        file:line that justifies the answers

version: 1
schema: srota/intent-ontology/v1
gate_doc: docs/product/INTENT-ONTOLOGY.md
cross_domain_doc: docs/product/CROSS-DOMAIN-LAWS.md
capability_doc: docs/product/CAPABILITY-MATRIX.md
capability_registry: docs/product/capability-registry.yaml
product_flows_doc: docs/product/PRODUCT-FLOWS.md
roots:
  product: application/compile_intent.py::CompileIntent
  compiler: model/compile_model.py::CompileRequestV3
# Gate-3 (docs/product/CROSS-DOMAIN-LAWS.md) resolved every Gate-1 decision.
# Definitions are carried HERE so the machine authority is self-describing:
# previously the labels were pending with no recorded meaning.
pending_decisions: []

decisions:
  D1:
    title: "Which declared layer is the page's subject?"
    source: docs/product/INTENT-ONTOLOGY.md:445
    kind: product-surface + identity law
    gate3_resolution: >-
      RESOLVED (identity law): CompileRequestV3 is the canonical design identity
      and design_hash derives from it; CompileIntent is a named-preset authoring
      surface in a SEPARATE namespace (intent_id). intent_id is never used as a
      base_design_hash.
    rehomed_to: null
    gate5_resolution: >-
      RESOLVED (product side): the Design page edits an INTENT DRAFT whose canonical
      serialization IS CompileRequestV3 (option b). CompileIntent is a named-preset
      entry shortcut that expands into an ordinary draft, never a second editable
      layer. Every editable field writes into the Intent Draft, never into a derived
      artifact, a compiled design, or backend config, unless the surface explicitly
      belongs to Evaluation or Optimization. intent_id is a preset-expansion record,
      never a design identity.
  D2:
    title: "Placement intent: keep placement entirely derived, or create a declared affinity/placement contract."
    source: docs/product/INTENT-ONTOLOGY.md:454
    kind: cross-domain scientific
    gate3_resolution: >-
      RESOLVED: placement stays entirely derived. No declared affinity /
      anti-affinity / locality / co-location / fixed-placement / reserved-resource /
      mapping-objective contract exists in v4. MappingPolicy is COMPILER-OWNED,
      correcting the Gate-1 phrase "owned by candidate generation".
    rehomed_to: null
  D3:
    title: "Design-space intent: pull OptimizationDefinition under Design/Intent, or keep the Optimize page as its sole owner."
    source: docs/product/INTENT-ONTOLOGY.md:458
    kind: cross-domain scientific
    gate3_resolution: >-
      RESOLVED: OptimizationDefinition is a Study Definition ABOVE the design. It is
      never part of CompileRequestV3, never enters design_hash, and is not Design
      Intent. definition_id and design_hash are disjoint namespaces; candidate_id
      binds both.
    rehomed_to: null
  D4:
    title: "NOT-MODELLED domains: explicitly out of scope for this redesign, or new contracts?"
    source: docs/product/INTENT-ONTOLOGY.md:460
    kind: cross-domain scientific (scope)
    gate3_resolution: >-
      RESOLVED: every §2 NOT-MODELLED concept remains NOT-MODELLED in v4. None has a
      scientific driver in the repository, and each "new" would convert a UI
      redesign into a compiler + contract redesign.
    rehomed_to: null
  D5:
    title: "Contract widening: confirm DesignView v2 must carry collectives, dependencies, address_map, physical and the product layer."
    source: docs/product/INTENT-ONTOLOGY.md:463
    kind: product-surface + projection authority
    gate3_resolution: >-
      RESOLVED (projection authority): the field-ownership matrix is the authority
      for what may be projected. A view may carry a field only if the matrix assigns
      it a source-of-value class, and a view never recomputes a derived value.
    rehomed_to: null
    gate5_resolution: >-
      RESOLVED (product side): DesignView widens to v2 carrying collectives,
      dependencies, address_map, physical and the product layer. Evidence: current
      DesignView v1 (apps/studio/src/types.ts:56) carries only design_hash,
      schema_version, compiler_semantics_version, workload, requirements, agents,
      noc_guided and locked_derived. Design pages consume DesignView + draft intent
      + compiled views from the API; no Python engine import into the frontend. A
      view-schema widening only - views are projections, never identities.
      Product-flow debt: PF-D4.
  D6:
    title: "Early validation: move the two doc-computable coherence checks into the form?"
    source: docs/product/INTENT-ONTOLOGY.md:467
    kind: product-surface + validation authority
    gate3_resolution: >-
      RESOLVED (validation authority): validation stays at the canonical stage that
      owns the rule (compile-stage L3d; report-stage L5). A form pre-check is an
      advisory affordance only, never a second authority, and its absence must not
      change the outcome.
    rehomed_to: null
    gate5_resolution: >-
      RESOLVED (product side): staged validation. on-edit = field/schema only;
      on-blur = field-level + local joins; preflight = the two doc-computable
      cross-domain joins (rank_count <= compute_instances; traffic_class in
      derive_v3_traffic_classes); compile = full canonical derivation + certificate;
      evaluate = backend qualification. Both named checks are cross-domain joins, not
      field-local rules, so evaluating them per keystroke would create a second
      authority for a cross-domain law. compile/report retain authority; a form
      pre-check is advisory only.
  D7:
    title: "Per-type classification sentinel: require every declared type to publish a reality/kind classification with a fail-closed sentinel?"
    source: docs/product/INTENT-ONTOLOGY.md:470
    kind: cross-domain scientific (enforceability)
    gate3_resolution: >-
      RESOLVED: YES. Required for WorkloadV3, RequirementV3, Agent, PhysicalContext,
      AddressMap, AddressRange, DependencyGraph, Dependency, CollectiveIntent,
      WorkloadSourceRef and CompileIntent. This is the mechanism that makes the
      field-ownership matrix enforceable rather than remembered.
    rehomed_to: null
  D8:
    title: "Visual primitive set: freeze the six primitives of §2.12 as the closed vocabulary?"
    source: docs/product/INTENT-ONTOLOGY.md:474
    kind: product-surface
    gate3_resolution: >-
      RESOLVED (mechanical): the six-primitive vocabulary is ALREADY frozen
      mechanically - check_intent_ontology.py validates visual in {1..6} per node.
      Gate 3 has no scientific content for the styling realisation.
    rehomed_to: wireframe gate (visual realisation only)
    gate5_resolution: >-
      RESOLVED (workflow side): the six primitives are already frozen mechanically
      (check_intent_ontology.py validates visual in {1..6} per node). Gate 5 adds
      only workflow meaning: 1 declaration control = an editable intent field;
      2 derived value = an inspect-only value; 3 refusal = a staged capability limit
      shown beside the field; 4 absence = not rendered; 5 identity = a provenance
      reference; 6 change class = the invalidation consequence of an edit. Detailed
      visual architecture belongs Gate 8.

# ── Domain planning (Gate 2) ──────────────────────────────────────────
# Planning order is dependency-respecting: a domain may be marked `planned`
# only when every domain in its `depends_on` is already `planned`, and every
# node in it carries a complete `plan:` block. scripts/check_intent_ontology.py
# enforces both. This is the PLANNING order, not the display order.
domains:
  SYSTEM:
    order: 1
    depends_on: []
    status: planned
    surfaces: [Agents]
    coherence:
      - id: compute_instances_ge_world_size
        rule: compute instance count >= tp*pp*ep*dp
        enforcement: L3d (doc-computable, currently compile-time)
        cite: model/mapping.py:181
      - id: single_clock_domain
        rule: at most one distinct clock domain across agents
        enforcement: L3x (doc-computable from agent rows)
        cite: model/fabric_artifact.py:305
      - id: single_power_domain
        rule: at most one distinct power domain across agents
        enforcement: L3x (doc-computable from agent rows)
        cite: model/fabric_artifact.py:317
      - id: address_target_indexes_agents
        rule: address_map.ranges[].target_agent_idx must index agents
        enforcement: L3d
        cite: model/address_decode.py:173
      - id: agents_non_empty
        rule: at least one agent group
        enforcement: L1d
        cite: model/compile_model.py:2219
    exits:
      - concept: system.machine_hierarchy
        decision: new_contract
        rationale: "S1: generic SystemContainer model"
      - concept: system.package
        decision: new_contract
        rationale: "S1: ContainerKind.PACKAGE"
      - concept: system.chiplet
        decision: new_contract
        rationale: "S1: ContainerKind.CHIPLET"
      - concept: system.accelerator
        decision: new_contract
        rationale: "S1: ContainerKind.ACCELERATOR"
      - concept: system.resource_domain
        decision: out_of_scope
        rationale: "S2: replaced by typed ClockDomain/PowerDomain"
      - concept: system.agent_capability
        decision: out_of_scope
        rationale: "S4: deferred until a semantic consumer exists"
      - concept: system.replication
        decision: out_of_scope
        rationale: "S5: count is canonical; policy belongs authoring/design-space"
      - concept: system.elastic_inventory
        decision: out_of_scope
        rationale: "S7: ranges belong DESIGN-SPACE"
      - concept: system.hierarchical_relationship
        decision: new_contract
        rationale: "S1: parent_id containment"
      - concept: system.affinity_domain
        decision: out_of_scope
        rationale: "S6: affinity policy belongs PLACEMENT"
      - concept: nodes / accelerators / chiplets (as kinds)
        decision: new_contract
        rationale: "S1 one generic containment model; nodes remain derived instances"
  PARALLELISM:
    order: 2
    depends_on: []
    status: planned
    surfaces: [Shape, Participants, Groups, Compatibility]
    coherence:
      - id: world_size_law
        rule: world_size = tp * pp * ep * dp, derived and never identity
        enforcement: L3d
        cite: model/parallelism.py:88
      - id: dimension_ordering_declared_once
        rule: algebra order (TP,EP,DP,PP) governs ranks; declaration order (tp,pp,ep,dp) governs serialization
        enforcement: L3x
        cite: model/placement.py:82
      - id: group_partition
        rule: every rank is in exactly one group per family; groups are disjoint; sum of sizes = world_size
        enforcement: L3x
        cite: model/parallelism.py:169
      - id: group_identity_is_stable
        rule: a group is identified by (family, fixed coordinates), never by array position
        enforcement: L1d
        cite: model/parallelism.py:42
      - id: one_member_law
        rule: a size-1 group exists but cannot carry a collective; communication is refused
        enforcement: L1d
        cite: workload/operations.py:82
      - id: no_physical_identity
        rule: no endpoint, agent, instance or router id may enter ParallelismIntent
        enforcement: L1d
        cite: backend/astra_namespace.py:1
      - id: mapping_is_injective
        rule: one logical rank maps to one distinct compute instance; oversubscription refuses
        enforcement: cross-domain (PLACEMENT)
        cite: model/mapping.py:181
      - id: serving_equivalence
        rule: a serving shape contradicting ParallelismIntent fails equivalence validation
        enforcement: cross-domain (SERVING)
        cite: docs/product/INTENT-PARALLELISM.md:1
    exits:
      - concept: PP stage assignment / point-to-point lowering
        decision: out_of_scope
        rationale: capability gap; pp>1 is a declarable shape without stage semantics
      - concept: DP replica / gradient semantics
        decision: out_of_scope
        rationale: DP is a collective axis only
      - concept: TP sharding law (heads / FFN)
        decision: out_of_scope
        rationale: TP names a group family, not a sharding law
      - concept: model divisibility laws
        decision: out_of_scope
        rationale: cross-domain gap; no hidden_size % TP check exists
      - concept: expert to EP rank assignment
        decision: out_of_scope
        rationale: tool/serving-side only; not inferred
      - concept: serving instance
        decision: out_of_scope
        rationale: SERVING owns instances; distinct identity from participants
      - concept: ASTRA rank
        decision: out_of_scope
        rationale: endpoint namespace, downstream of placement
      - concept: custom / arbitrary axes
        decision: out_of_scope
        rationale: strict TP/DP/PP/EP only; no dimension dictionary
      - concept: partial-membership collectives
        decision: out_of_scope
        rationale: not supported by the certified serving loop
  WORKLOAD:
    order: 3
    depends_on: []
    status: planned
    surfaces: [Overview, Architecture, Phases, Operations, Communication, Memory]
    coherence:
      - id: operation_id_unique
        rule: operation_id is unique and is the scientific identity
        enforcement: L1d
        cite: workload/graph.py:472
      - id: dag_acyclic
        rule: dependency edges form a DAG; no self-edge, no duplicate, no missing target
        enforcement: L1d
        cite: workload/operations.py:270
      - id: edges_are_the_only_sequencing_authority
        rule: serialized node order is never a second sequencing authority
        enforcement: L1d
        cite: workload/graph.py:645
      - id: symbolic_scope_only
        rule: an operation names a symbolic axis, never a numeric participant count
        enforcement: L1n
        cite: model/compile_model.py:1891
      - id: payload_single_authority
        rule: explicit bytes is the only payload authority; positive and divisible where the schedule requires
        enforcement: L1n + L3x
        cite: workload/operations.py:92
      - id: collective_kind_vocabulary
        rule: collective kind comes from the single production authority
        enforcement: L1n
        cite: workload/collectives.py:29
      - id: moe_requires_explicit_dispatch_and_combine
        rule: MoE meaning requires EXPERT_DISPATCH / EXPERT_COMBINE; EP + ALLTOALL is generic
        enforcement: L1d (semantic law)
        cite: workload/intent_lowering.py:224
      - id: scope_resolved_only_after_binding
        rule: a workload referencing TP is valid without knowing TP=1|2|8
        enforcement: cross-domain (PARALLELISM)
        cite: model/compile_model.py:1891
    exits:
      - concept: repeat / iteration
        decision: out_of_scope
        rationale: "W19: presets and editors expand repetitions before canonicalization"
      - concept: conditional / dynamic graphs
        decision: out_of_scope
        rationale: runtime-only; routing_policy supports EXPLICIT_TRACE only
      - concept: tensor shapes
        decision: out_of_scope
        rationale: payload is explicit bytes; no dual authority
      - concept: expert identity / token-level routing
        decision: out_of_scope
        rationale: "W11: not fabricated; dispatch and combine are explicit operations"
      - concept: compute duration
        decision: out_of_scope
        rationale: compute timing belongs the performance layer, not canonical workload
      - concept: request trace
        decision: out_of_scope
        rationale: "W12: SERVING EXPERIMENT owns request traces"
      - concept: scheduler / batching / queue policy
        decision: out_of_scope
        rationale: "W12: SERVING EXPERIMENT owns scheduling"
      - concept: KV read / write operations
        decision: out_of_scope
        rationale: serving/KV semantics; no canonical static equivalent
      - concept: BARRIER
        decision: out_of_scope
        rationale: no consumer; not introduced
      - concept: collective algorithm mapping (RING/DIRECT/ROOT_FANOUT)
        decision: new_contract
        rationale: "W8: CollectiveLoweringPolicy — lowering semantics identity, not workload identity"
  COMMUNICATION_INTENT:
    order: 4
    depends_on: [PARALLELISM]
    status: planned
    surfaces: [Classification, Classes, Bindings, Execution support]
    coherence:
      - id: one_class_authority
        rule: WORKLOAD owns the semantic operation; COMMUNICATION owns the operation-to-class binding
        enforcement: L1d
        cite: docs/product/INTENT-COMMUNICATION.md:1
      - id: explicit_totality
        rule: every network-producing operation has exactly one binding after canonicalization; non-network operations have none
        enforcement: L1d
        cite: workload/intent_lowering.py:104
      - id: one_operation_one_class
        rule: all N logical messages of an operation inherit that operation's class
        enforcement: L1d
        cite: workload/messages.py:201
      - id: class_identity_preserved
        rule: class identity survives operation -> bound -> message -> physical traffic -> VC -> evidence
        enforcement: L1d
        cite: workload/traffic.py:136
      - id: class_identity_stable
        rule: display_name is metadata; class_id is semantic; renaming never moves identity
        enforcement: L1d
        cite: docs/product/INTENT-COMMUNICATION.md:1
      - id: no_implicit_default_class
        rule: canonicalization materializes explicit bindings; no hidden default routing class
        enforcement: L1d
        cite: workload/messages.py:51
      - id: route_independence
        rule: traffic class does not affect route derivation
        enforcement: L3x
        cite: model/routing.py:52
      - id: message_class_identity_scope
        rule: class participates in artifact identity only, never in message_id
        enforcement: L1d
        cite: docs/product/INTENT-COMMUNICATION.md:1
    exits:
      - concept: virtual networks
        decision: out_of_scope
        rationale: no vnet concept exists
      - concept: priority / scheduling class
        decision: out_of_scope
        rationale: arbitration is a single global knob; no per-class consumer
      - concept: reliability / lossless / retry
        decision: out_of_scope
        rationale: no reliability model exists
      - concept: class-to-plane binding
        decision: out_of_scope
        rationale: PlaneComposition has one member; multiplane needs a schema extension
      - concept: RCU / in-network reduction
        decision: out_of_scope
        rationale: FABRIC/ROUTER capability; no canonical artifact
      - concept: hardware multicast
        decision: out_of_scope
        rationale: not routable, verifiable or executable; semantic multicast lowers as source replication
      - concept: class isolation mechanism
        decision: out_of_scope
        rationale: F7_qos_isolation is a WARN obligation; mechanism belongs compiler/fabric/router
      - concept: per-message class artifact
        decision: new_contract
        rationale: COMM-D1 - versioned LogicalCommunicationArtifactV3
      - concept: static/serving shared class identity
        decision: new_contract
        rationale: FUTURE CONTRACT - requires an explicit serving adapter
  FABRIC_INTENT:
    order: 5
    depends_on: [SYSTEM]
    status: planned
    surfaces: [Fabric (intent), Topology / Endpoint inspector (post-compile)]
    coherence:
      - id: typed_fabric_intent
        rule: FabricIntentV4 is typed (Mesh/Torus variants + link_width_bits); no parameter bag
        enforcement: L1n
        cite: docs/product/INTENT-FABRIC.md:1
      - id: side_length_not_radix
        rule: radix is the grid side k (router_count = k*k), renamed side_length
        enforcement: L3x
        cite: model/topology_artifact.py:399
      - id: square_only
        rule: topology is strictly square k x k; no rectangular shape is admitted
        enforcement: L3x
        cite: model/topology_artifact.py:358
      - id: topology_is_physical
        rule: TopologyArtifact includes channel properties (width); structural connectivity is a derived projection
        enforcement: L1d
        cite: model/topology_artifact.py:293
      - id: one_agent_one_endpoint
        rule: every AgentInstance receives exactly one endpoint; no unattached agent, no shared endpoint
        enforcement: L1d
        cite: model/attachment.py:448
      - id: idle_agents_attached
        rule: idle compute agents still consume endpoints; they are never removed from the fabric
        enforcement: L3d
        cite: model/attachment.py:444
      - id: capacity_law
        rule: success iff agent_count <= sum(router.seat_capacity)
        enforcement: L3d
        cite: model/attachment.py:444
      - id: attachment_after_topology
        rule: attachment consumes topology seats; it is derived after topology and never consults MappingArtifact
        enforcement: L3x
        cite: model/attachment.py:423
      - id: attachment_semantics_unbound
        rule: "BLOCKER (FAB-D1): ATTACHMENT_ORDER_V1 governs bindings but is not bound to artifact identity"
        enforcement: L3x
        cite: model/attachment.py:417
      - id: native_projection_domain
        rule: native mesh-DOR requires square, seat_capacity 1, identity-prefix, DOR_XY, latency 1, single class
        enforcement: L3x
        cite: backend/booksim_projection.py:29
      - id: no_endpoint_omitted
        rule: every attached endpoint is projected; node count is the router count; unused routers remain
        enforcement: L3x
        cite: backend/booksim_projection.py:421
      - id: backend_namespaces_explicit
        rule: endpoint -> ASTRA Sys.id / BookSim node is an explicit projection; same integer is not identity
        enforcement: L3x
        cite: backend/astra_namespace.py:1
      - id: bandwidth_not_intent
        rule: absolute bandwidth is width x evaluation clock; it is never a static Fabric intent field
        enforcement: docs
        cite: docs/product/INTENT-FABRIC.md:1
    exits:
      - concept: multiplane
        decision: out_of_scope
        rationale: FUTURE CAPABILITY CONTRACT; per-plane routing/VC/attachment semantics do not exist
      - concept: hardware multicast
        decision: out_of_scope
        rationale: no multicast tree in any route artifact; capability status is NOT REPRESENTED
      - concept: arbitration
        decision: out_of_scope
        rationale: moves to ROUTER/RESOURCE
      - concept: RCU / in-network reduction
        decision: out_of_scope
        rationale: moves to ROUTER/RESOURCE; unsupported
      - concept: custom / hierarchical topology
        decision: out_of_scope
        rationale: requires stable ids, connectivity validation and routing compatibility
      - concept: plane count as user intent
        decision: out_of_scope
        rationale: single-valued enum; no scientific choice with one valid value
      - concept: router pipeline latency
        decision: out_of_scope
        rationale: no field exists; belongs ROUTER/RESOURCE if ever real
      - concept: absolute bandwidth
        decision: out_of_scope
        rationale: depends on the evaluation clock
      - concept: typed FabricIntent
        decision: new_contract
        rationale: FAB-D3
      - concept: topology derivation semantics
        decision: new_contract
        rationale: FAB-D4
      - concept: stable seat / endpoint identity
        decision: new_contract
        rationale: FAB-D2
      - concept: attachment semantics identity
        decision: new_contract
        rationale: FAB-D1 (ATTACHMENT_ORDER_V1)
      - concept: context-bound attachment parents
        decision: new_contract
        rationale: FAB-D7
      - concept: typed capacity refusal / preflight
        decision: new_contract
        rationale: FAB-D5
  MEMORY_INTENT:
    order: 6
    depends_on: [SYSTEM]
    status: planned
    verdict: PLANNED — COHERENT
    doc: docs/product/INTENT-MEMORY.md
    surfaces: [System -> Advanced memory (address map only)]
    finding: |
      Two disconnected memory worlds. AddressMap is canonical and in the compile
      path (decoded into FabricArtifact). The Phase-9 operand/location chain ->
      memory_lowering -> Ramulator is real, typed and tested but called by
      nothing in the product: build_artifact is invoked only from
      memory_lowering.py:331, and RamulatorBackend has no service, gateway, CLI
      or evaluation caller.
    intent:
      - AddressMap (ranges: name/base/size/target_agent_idx) — the entire memory intent
    coherence:
      - id: address_map_is_the_intent
        rule: MemoryIntentV4 declares address_map only; no technology/channel/capacity/timing field without a consumer
        enforcement: L1n
        cite: model/compile_model.py:676
      - id: addr_width_bounds_domain
        rule: base + size <= ADDRESS_DOMAIN_SIZE; the endpoint interface address width is the design-level bound
        enforcement: L1n
        cite: model/address_decode.py:405
      - id: singleton_target_group
        rule: a range targets exactly one agent group; no interleave/selection policy exists
        enforcement: L3d
        cite: model/address_decode.py:436
      - id: target_is_positional
        rule: target_agent_idx indexes the agents tuple -> MEM-D1; must become a stable AgentGroupId
        enforcement: L1n
        cite: model/compile_model.py:660
      - id: no_network_memory_coupling
        rule: Ramulator is standalone trace execution; memory and network latency are never summed
        enforcement: L3x
        cite: simulation/ramulator.py:1
      - id: honest_fidelity_labels
        rule: request generation (recorded stream) and DRAM timing (MEMORY_CYCLE_SIMULATION) are labelled separately, never collapsed
        enforcement: L1d
        cite: simulation/ramulator.py:137
      - id: drain_reconciliation
        rule: PASS only when issued == accepted == served; a shortfall is INCONCLUSIVE, never PASS
        enforcement: L1d
        cite: simulation/ramulator.py:19
      - id: fixed_v1_envelope
        rule: only the audited HBM3/HBM34 geometry executes; anything else refuses UNSUPPORTED, never substituted
        enforcement: L1n
        cite: simulation/ramulator.py:56
      - id: trace_is_projection
        rule: the backend ReadWriteTrace is a projection, never identity authority
        enforcement: L1n
        cite: workload/memory_lowering.py:590
      - id: memory_evaluation_unwired
        rule: no product path reaches the memory lowering/execution chain (MEM-EVAL-D1)
        enforcement: L3x
        cite: workload/memory_lowering.py:331
      - id: target_is_agent_instance
        rule: v4 AddressRange targets a stable AgentInstanceId; the group-singleton law was an accidental legacy abstraction
        enforcement: L3d
        cite: model/address_decode.py:171
      - id: memory_capable_target_only
        rule: an AddressRange target MUST be HBM_CONTROLLER; COMPUTE_TILE/NIC/PERIPHERAL/UCIE_PORT are INVALID
        enforcement: L1n
        cite: model/address_decode.py:464
      - id: half_open_ranges
        rule: ranges are half-open [base, base+size) with size >= 1 and checked integer arithmetic
        enforcement: L1n
        cite: model/compile_model.py:660
      - id: no_overlap
        rule: ranges MUST NOT overlap; no first/last-match or declaration-order decode authority
        enforcement: L1n
        cite: model/address_decode.py:246
      - id: gaps_legal
        rule: total coverage is not required; an address in no region is UNMAPPED_ADDRESS at use time
        enforcement: L1d
        cite: model/address_decode.py:157
      - id: identity_excludes_presentation
        rule: range names, row order and hex/decimal presentation never participate in identity
        enforcement: L1n
        cite: model/address_decode.py:420
      - id: no_locality_claim
        rule: locality is never inferred; compute->memory and data->memory bindings are CONTRACT NOT AVAILABLE
        enforcement: L3x
        cite: model/placement.py:242
      - id: no_latency_summation
        rule: BookSim and Ramulator latency are never summed into end-to-end latency
        enforcement: L3x
        cite: simulation/ramulator.py:19
      - id: profile_identity
        rule: changing technology/scheduler/row policy/refresh/clock ratio/geometry changes profile identity; nearest profile is never substituted
        enforcement: L1n
        cite: simulation/ramulator.py:56
      - id: no_metric_without_contract
        rule: no memory metric is registered without target, population, unit, time domain, qualified producer and semantics version
        enforcement: L1n
        cite: optimization/metric_registry.py:272
      - id: legacy_grammar_refused
        rule: REMOTE / CXL / STORAGE fail closed at lowering; only LOCAL resolves to the v1 HBM pool
        enforcement: L1d
        cite: workload/memory_lowering.py:119
    exits:
