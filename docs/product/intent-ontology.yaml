  PRODUCT:
    order: 12
    depends_on: [SYSTEM, PARALLELISM, WORKLOAD, COMMUNICATION_INTENT, FABRIC_INTENT, MEMORY_INTENT, PHYSICAL, PLACEMENT_INTENT, ROUTER_RESOURCE_INTENT, REQUIREMENTS, DERIVED]
    status: unplanned
  DESIGN_SPACE_INTENT:
    order: 13
    depends_on: [FABRIC_INTENT, ROUTER_RESOURCE_INTENT]
    status: planned
    verdict: PLANNED — COHERENT
    doc: docs/product/INTENT-DESIGN-SPACE.md
    surfaces: [Optimize -> Study, Optimize -> Results]
    finding: |
      Not greenfield: a canonical, typed, product-wired optimizer already exists.
      The optimizer proposes; canonical compilation/evaluation decides. Three
      authorities are never merged (product RequirementReport / optimization
      constraints / measured objectives). Candidate identity is content-addressed
      over (base_design_hash, canonical patch) and re-derived with drift refusal.
      Pareto eligibility is a nine-term typed predicate owned by the backend; the
      frontend reads pareto_eligible/pareto_member and never recomputes.
    coherence:
      - id: optimizer_proposes_only
        rule: the optimizer never compiles, verifies, evaluates or mints evidence; optimize_certified is the only certified entry point and owns its evaluator
        enforcement: L3x
        cite: optimization/result.py:699
      - id: locked_properties_inexpressible
        rule: routing, VC count/structure, turn restrictions and escape VC are refused by name at definition construction
        enforcement: L1n
        cite: optimization/definition.py:44
      - id: typed_dimensions_only
        rule: dimensions are DomainParams over NocConfig GUIDED fields; no arbitrary JSON path mutation exists
        enforcement: L1n
        cite: optimization/definition.py:36
      - id: candidate_identity_content
        rule: candidate_id = content_id(base_design_hash, canonical patch); transplanted ids and drift refuse
        enforcement: L1d
        cite: optimization/candidate.py:57
      - id: three_authorities_never_merged
        rule: product requirements, optimization constraints and measured objectives stay separate namespaces
        enforcement: L1d
        cite: optimization/result.py:329
      - id: unmeasurable_never_passes
        rule: a missing value is UNMEASURABLE (never 0, never infinity, never a fabricated score)
        enforcement: L1d
        cite: optimization/constraints.py:24
      - id: analytic_never_eligible
        rule: non-certified (analytic/fake) evaluations are structurally never Pareto-eligible
        enforcement: L1d
        cite: optimization/result.py:913
      - id: eligibility_backend_owned
        rule: pareto_eligible is computed from authoritative stages; the frontend must not recompute the frontier
        enforcement: L3x
        cite: apps/studio/src/components/OptimizeView.tsx:38
      - id: metric_authority_frozen
        rule: objectives resolve in the frozen CertifiedMetricRegistry; optimization never redefines metric semantics
        enforcement: L1n
        cite: optimization/metric_registry.py:272
      - id: certified_metrics_from_claims
        rule: in the certified path the evaluator's objective_values never score; metrics are extracted from verified claims and a misreport refuses
        enforcement: L1d
        cite: optimization/result.py:268
      - id: exact_dominance
        rule: no_worse AND strict, direction-aware, no epsilon; ties stay ties
        enforcement: L1d
        cite: optimization/pareto.py:18
      - id: selection_is_separate
        rule: selection is an explicit policy over feasible Pareto members with a deterministic tiebreak; no hidden best candidate
        enforcement: L1d
        cite: optimization/result.py:565
      - id: single_backend_per_study
        rule: one evaluation backend/profile per study; silent substitution is structurally impossible
        enforcement: L1n
        cite: cli/cli.py:1658
      - id: v2_lossless_v1_lossy
        rule: the v2 study view is lossless; v1 collapses UNMEASURABLE to false and is explicitly LOSSY
        enforcement: L1d
        cite: optimization/result.py:527
      - id: arbitration_normalized_after_identity
        rule: string dimensions are hashed before domain canonicalization (OPT-D2)
        enforcement: L1n
        cite: model/router_behavior.py:217
    exits:
      - concept: arbitrary JSON path mutation
        decision: out_of_scope
        rationale: structurally unreachable; patch keys are a closed GUIDED registry
      - concept: derived-artifact optimization
        decision: out_of_scope
        rationale: routing, VC, turn and escape properties are refused by name
      - concept: candidate-owned resource dimensions
        decision: new_contract
        rationale: the category is defined but no GUIDED field exists today
      - concept: scientific deduplication / alias accounting
        decision: new_contract
        rationale: OPT-D8; ledger W11 HISTORICAL
      - concept: compile / evidence reuse cache
        decision: new_contract
        rationale: OPT-D5; no reuse exists although the identities to key it do
      - concept: surrogate / predicted performance
        decision: out_of_scope
        rationale: no guidance model exists; a prediction may never enter the measured frontier
      - concept: serving objectives
        decision: out_of_scope
        rationale: static BookSim only; TTFT/throughput are FUTURE CAPABILITY
      - concept: memory objectives
        decision: out_of_scope
        rationale: Domain I - no registered memory MetricId
      - concept: TP/DP/PP/EP dimensions
        decision: out_of_scope
        rationale: Wave-F PARAM_REGISTRY SUPERSEDED; not cheap numerical knobs
      - concept: Bayes / MILP / SA / BO / RHO / GRPO engines
        decision: new_contract
        rationale: REJECT (deferred) until deterministic correctness is established
      - concept: scalar composite score or weighted objective
        decision: out_of_scope
        rationale: objectives are metric+direction only; no overall score is authoritative
      - concept: mixed-producer or mixed-backend frontier
        decision: out_of_scope
        rationale: unreachable by construction (one backend, one registry per study)
      - concept: per-candidate backend substitution
        decision: out_of_scope
        rationale: one profile per study; --evaluate has a single choice
      - concept: pre-compile constraint stage
        decision: new_contract
        rationale: constraints are evaluated post-evaluation today
      - concept: study vs search-execution identity split
        decision: new_contract
        rationale: OPT-D3; method/budget/seed currently live in definition_id
      - concept: arbitrary user objective formulas
        decision: out_of_scope
        rationale: no expression parsing; operators are exactly <= and >=

