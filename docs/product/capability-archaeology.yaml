# Evidence-first capability archaeology — machine-readable ledger.
#
# WHY THIS FILE EXISTS
#
# The capability registry answered "what is canonical?" The question that
# was never asked, and that cost us a GEC-class miss, is "what already
# exists?" A capability can be implemented, executed and measured in the
# BookSim fork or a research script while the canonical product exposes
# none of it. This ledger separates those axes.
#
# EVIDENCE ORDER (source beats prose):
#   1 executable backend/source  2 experiment scripts + committed results
#   3 tests/qualification        4 historical branches/commits
#   5 canonical representation   6 registries  7 product/API/Studio
#
# A field is a sentence, never a bare flag, wherever a bare flag would
# collapse distinct identities.
schema_version: 1
registry_version: evidence-archaeology-v1

#: Classification vocabulary (multiple may apply to one capability).
classifications:
  - CURRENT_CANONICAL
  - CURRENT_QUALIFIED
  - CURRENT_BACKEND_ONLY
  - CURRENT_LEGACY_EXECUTABLE
  - CURRENT_DOWNSTREAM_ONLY
  - CURRENT_RESEARCH
  - HISTORICAL_EXECUTABLE
  - HISTORICAL_MEASURED
  - PROTOTYPE_ONLY
  - DOC_STALE
  - TRULY_ABSENT

#: EXACT semantics. A classification must have mechanical meaning, or the
#: ledger is prose with a schema bolted on.
classification_definitions:
  CURRENT_CANONICAL: >
    The capability has a current canonical VERITX representation or
    primitive that PARTICIPATES IN THE CANONICAL AUTHORITY MODEL — an
    identity owner, a sealed artifact, a registered authority, a typed
    contract that other canonical code derives from. It does NOT mean
    merely "the source file is currently in the repository". A record
    classified CURRENT_CANONICAL must state CANONICAL_REPRESENTATION = YES,
    or PARTIAL with the canonical portion named.
  CURRENT_QUALIFIED: >
    Executes through a canonical path AND its output is qualified against
    an authority (certificate, profile, executed-equivalence, oracle).
  CURRENT_BACKEND_ONLY: >
    The backend implements it and can execute it, but no canonical
    representation or projection reaches it.
  CURRENT_LEGACY_EXECUTABLE: >
    Reachable only through the pre-product legacy CLI path.
  CURRENT_DOWNSTREAM_ONLY: >
    Implemented and executed inside a downstream component (LLMServingSim,
    ASTRA-sim) with no canonical upstream bridge.
  CURRENT_RESEARCH: >
    Current, executable research code (scripts/, experiments/, harnesses)
    that is NOT part of the canonical authority model.
  HISTORICAL_EXECUTABLE: >
    Was executable at a recorded historical commit; not reproducible at
    HEAD (scripts removed, patch unapplied).
  HISTORICAL_MEASURED: >
    A measurement result exists in recorded history (commit-qualified
    artifact or durable run record); it is NOT a current qualification.
  PROTOTYPE_ONLY: >
    A prototype/component exists but is wired into no canonical or
    scientific execution path.
  DOC_STALE: >
    A registry or document describes an older state that executable
    evidence contradicts. ORTHOGONAL — a record may be DOC_STALE in
    addition to any other classification.
  TRULY_ABSENT: >
    Searched current canonical code, backend source, legacy CLI, research
    scripts, archive/, historical branches, tests and committed results,
    and found no implementation, execution or measurement evidence. The
    search scope must be recorded on the record.

#: Every record answers these independently. No collapsed SUPPORTED flag.
fields:
  - IMPLEMENTED_ANYWHERE
  - EXECUTED_ANYWHERE
  - MEASURED_ANYWHERE
  - CURRENT_ACTIVE_IMPLEMENTATION
  #: CANONICAL_REPRESENTATION is RETAINED as the historical summary axis, but
  #: it could not distinguish "the design can be DECLARED" from "the physical
  #: fabric can be DERIVED". PHASE B.2 adds the two layers explicitly: a
  #: capability may now have a canonical INTENT with no canonical physical
  #: ARTIFACT (GEC's four modes, fat-tree) or vice versa.
  - CANONICAL_INTENT
  - CANONICAL_PHYSICAL_ARTIFACT
  - CANONICAL_REPRESENTATION
  - CANONICAL_DERIVATION
  - VERIFIER_EXISTS
  - BACKEND_PROJECTION
  - BACKEND_EXECUTABLE
  - QUALIFICATION_EXISTS
  - EVIDENCE_CONTRACT
  - PRODUCT_WIRED
  - MISSING_BRIDGE

