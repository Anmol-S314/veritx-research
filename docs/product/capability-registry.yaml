version: 1
schema: srota/capability-registry/v1
capability_semantics_version: cap-v1
narrative: docs/product/CAPABILITY-MATRIX.md
stages:
- id: DECLARABLE
  question: can canonical intent/schema represent it?
- id: DERIVABLE
  question: can the canonical compiler/lowering produce the required artifacts?
- id: VERIFIABLE
  question: can mandatory canonical verification issue a meaningful verdict?
- id: PROJECTABLE
  question: can it be projected into a concrete backend representation?
- id: EXECUTABLE
  question: can a backend actually execute that projection?
- id: QUALIFIED
  question: does a named profile authorize a scientific claim for that execution?
- id: EVIDENCE_CAPABLE
  question: can authenticated evidence be produced for the claimed property?
- id: PRODUCT_WIRED
  question: can the product invoke and expose it today?
results:
- 'YES'
- 'NO'
- CONDITIONAL
- NOT_APPLICABLE
- LEGACY_ONLY
- FUTURE_CONTRACT
- ENGINE_ONLY
product_wiring:
- WIRED
- ENGINE_ONLY
- INSPECT_ONLY
- NOT_AVAILABLE
reasons:
- NO_CONTRACT
- NO_DERIVATION
- NO_VERIFIER
- NO_BACKEND_PROJECTION
- BACKEND_UNAVAILABLE
- NOT_QUALIFIED
- NO_EVIDENCE_CONTRACT
- PRODUCT_NOT_WIRED
- LEGACY_ONLY
- FUTURE_CONTRACT
- INVALID_COMBINATION
- IMPLEMENTATION_GAP
envelopes:
  CAP-ENV-BOOKSIM-MESH-DOR-XY-V1:
    profile_id: CERTIFIED_BOOKSIM_MESH_DOR_XY_V1
    semantics_version: booksim2-fork+P1B-meshdor-dump
    authorizes: QUALIFIED + EVIDENCE_CAPABLE for mesh DOR-XY static evaluation
    required_conditions:
    - COND-TOPOLOGY-MESH
    - COND-ROUTING-DOR-XY
    - COND-SINGLE-COMM-CLASS
    - COND-IDENTITY-VC-TRANSITIONS
    - COND-SINGLE-CLOCK-FABRIC
    - COND-DENSE-STATIC-WORKLOAD
    - COND-CONFIG-AUDIT-CLOSED
    claim_scope: Qualified network-cycle simulation of a dense static workload over a square
      mesh with DOR-XY routing under the pinned config audit.
    failure_meaning: NOT QUALIFIED FOR THIS ENVELOPE - the design remains canonically valid
  CAP-ENV-BOOKSIM-ANYNET-V1:
    profile_id: CERTIFIED_BOOKSIM_ANYNET_V1
    semantics_version: booksim2-fork+B3.7b-anynet-dump
    authorizes: QUALIFIED + EVIDENCE_CAPABLE for canonical-route static evaluation
    required_conditions:
    - COND-CANONICAL-ROUTE-PRESENT
    - COND-SINGLE-COMM-CLASS
    - COND-SINGLE-CLOCK-FABRIC
    - COND-DENSE-STATIC-WORKLOAD
    - COND-CONFIG-AUDIT-CLOSED
    claim_scope: Qualified network-cycle simulation of a dense static workload over the canonical
      route table, with first-hop routing-function equivalence to the canonical route over
      the complete source x destination domain.
    failure_meaning: NOT QUALIFIED FOR THIS ENVELOPE - the design remains canonically valid
  CAP-ENV-BOOKSIM-SERVING-V1:
    profile_id: CERTIFIED_SERVING_BOOKSIM2_V1
    authorizes: QUALIFIED + EVIDENCE_CAPABLE for serving-round evaluation
    required_conditions:
    - COND-SERVING-ROUND-QUALIFIED
    - COND-CONFIG-AUDIT-CLOSED
    claim_scope: Qualified serving-round network execution against a qualified ASTRA machine
      projection. LLMServingSim owns request semantics.
    failure_meaning: NOT QUALIFIED FOR THIS ENVELOPE - the design remains canonically valid
  CAP-ENV-CERTIFIED-OPTIMIZATION-V1:
    profile_id: certified-builtin-v1
    semantics_version: veritx/optimization-result/v2
    authorizes: QUALIFIED + EVIDENCE_CAPABLE for certified Pareto studies
    required_conditions:
    - COND-CERTIFIED-BACKEND-AUTHORITY
    - COND-CONFIG-AUDIT-CLOSED
    claim_scope: Certified single-backend, single-fidelity Pareto study over the closed GUIDED
      design space, with three never-merged authorities and fail-closed typed ineligibility.
    failure_meaning: ANALYTIC_RESEARCH - never certified Pareto
  CAP-ENV-RAMULATOR-V1:
    profile_id: ramulator-2.1-v1
    semantics_version: veritx_dse.simulation.ramulator/1
    authorizes: QUALIFIED + EVIDENCE_CAPABLE for standalone DRAM timing
    required_conditions:
    - COND-RAMULATOR-V1
    claim_scope: Standalone DRAM-cycle timing simulation over a recorded legacy-derived request
      stream. request_generation is a recorded stream; dram_timing is MEMORY_CYCLE_SIMULATION.
    failure_meaning: UNSUPPORTED or EVALUATION_FAILED - never a zero-latency result
conditions:
  COND-TOPOLOGY-MESH: topology_family == MESH and radix is a perfect square
  COND-ROUTING-DOR-XY: canonical routing is DOR-XY (anynet_dijkstra_hops not required)
  COND-CANONICAL-ROUTE-PRESENT: RouteArtifact + ResolvedRoute derive and terminate
  COND-SINGLE-COMM-CLASS: exactly one unified traffic class after lowering
  COND-IDENTITY-VC-TRANSITIONS: allowed_transitions is the identity class map
  COND-SINGLE-CLOCK-FABRIC: at most one distinct clock domain across agents
  COND-DENSE-STATIC-WORKLOAD: dense_transformer model family, static evaluation path
  COND-CONFIG-AUDIT-CLOSED: every result-affecting backend config value has a ParameterOwner
    and the closed-world audit passes
  COND-RAMULATOR-V1: dram_class HBM3, controller HBM34, mapping sequential_bankstriped_v1,
    clock_ratio 4/1
  COND-SERVING-ROUND-QUALIFIED: AstraServingRoundQualification predicates all pass
  COND-CERTIFIED-BACKEND-AUTHORITY: the evaluation authority is certified-backend and the
    authenticated proof re-verifies (the label alone admits nothing)
