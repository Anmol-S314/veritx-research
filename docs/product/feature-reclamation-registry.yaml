branch_cleanup_rule:
  branches_deleted_or_modified: 0
  rule: 'A branch may be archived ONLY after traceability exists: unique capability identified,
    canonical replacement identified, test replacement identified, retained commit/tag recorded.
    Branches holding the only implementation of a RECLAIMABLE or NEEDS_CANONICALIZATION capability
    MUST be retained.'
  protected_branches:
  - branch: integration/canonical
    why: carries veritx_dse/synthesis/{milp_topology_v2,bo_synthesizer,iterative_synthesizer,event_objective}.py
  - branch: main
    why: carries the same synthesis module
  - branch: prod/production-readiness
    why: carries the same synthesis module
  - branch: rebuild/live-product-flow
    why: carries the same synthesis module
  - branch: validation/b4-campaign
    why: carries milp_topology_v2.py
  - branch: longhaul/econ-test
    why: carries the same synthesis module
  - branch: local/serving-preflight-guard
    why: carries the same synthesis module
  - branch: github/audit/wave-f-parity-ledger
    why: Wave-F parity evidence
  - branch: github/audit/rt-final-optimization-truth
    why: adversarial optimization-truth suite (14 cases)
  - branch: github/audit/rt-final-optimization-truth-v2
    why: candidate status/reason in records
  - branch: github/audit/rt-final-reports
    why: evidence-only; never merge
  - branch: github/audit/rt-final-reports-v2
    why: evidence-only; never merge
  - branch: github/t3-rtl-noc-backup-20260814
    why: RTL/NoC backup
  - branch: github/t3-rtl-noc-backup-20260815
    why: RTL/NoC backup
  - branch: origin/reference/gec-wire-pricing
    why: GEC wire-pricing variant of gec.cpp
  - branch: origin/astrasim-manal
    why: ASTRA-Sim topology integration
  - branch: origin/updated-booksim
    why: BookSim fork with local changes
  - branch: github/epic/booksim-forward-port
    why: FabricArtifact/MappingArtifact binding
  proposed_for_archival: []
  archival_note: 'None proposed: the audit is incomplete, so no capability has yet been shown
    to have a canonical + test replacement.'
