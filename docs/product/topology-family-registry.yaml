  tree4:
    canonical_id: tree4
    truth: [tree4]
    role: RESEARCH
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "NO",
             ROUTABLE: "NO", VERIFIABLE: "NO", PROJECTABLE: "NO",
             EXECUTABLE: "NO", QUALIFIED: "NO", WIRED: "NO"}
    intent_schema: "StructuredTopologyIntent(family=tree4)"
    materializer: null
    backend_projection: {booksim: tree4, astra: null}
    evidence: "capability truth probes tree4 end to end (all YES except WIRED); the row underclaims until §6 ships it"
    note: "AUTHORABLE=YES is verified by check_topology_family_registry via the structured intent. Every later NO is a KNOWN UNDERCLAIM against live truth, pending the §6 enum + product-wiring work — not a finding the gates may auto-resolve. MATERIALIZABLE stays NO until tree4 joins MaterializedFamily."

  custom:
    canonical_id: custom
    truth: [explicit]
    role: USER_FAMILY
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "PARTIAL", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "PARTIAL", WIRED: "NO"}
    intent_schema: "TopologyIR kind=custom|anynet (explicit undirected links; link_attrs.bandwidth_GBs/latency_ns required)"
    materializer: "topology_artifact.materialize_ir(TopologyIR)"
    backend_projection: {booksim: anynet, astra: "namespace (explicit dims required)"}
    evidence: "model/topology_ir.py (validated, strict); materializer added in AMEND-2; test_topology_ir.py recovered from integration/p1-product-rt-candidate"
    note: "ROUTABLE=PARTIAL and QUALIFIED=PARTIAL are inherited from the
           existing AnyNet path (ROUTE-002/003). No coordinates are required."

#: Backend spellings are NOT canonical identity. A backend rename must not
#: silently change scientific identity.
backend_spelling_boundary:
  law: "canonical_id != backend spelling; projection is explicit and one-way"
  examples:
    - {canonical: torus, booksim: torus, astra: "mesh (1-D torus lowers to Ring)"}
    - {canonical: concentrated_mesh, booksim: cmesh, astra: mesh}
    - {canonical: custom, booksim: anynet, astra: "explicit dims"}
    - {canonical: flattened_butterfly, booksim: ftree, astra: null}
    - {canonical: gec, booksim: gec, astra: null}

#: Invariants the checker enforces. Each is a test, not prose.
invariants:
  - id: TAX-1
    law: "RECOGNIZED does not imply AUTHORABLE"
    witness: "gec/fat_tree are RECOGNIZED and AUTHORABLE but not MATERIALIZABLE; dragonfly is RECOGNIZED, not AUTHORABLE"
  - id: TAX-2
    law: "AUTHORABLE does not imply MATERIALIZABLE"
    witness: "gec, fat_tree"
  - id: TAX-3
    law: "MATERIALIZABLE does not imply AUTHORABLE"
    witness: "ring (TEST_FIXTURE), flatfly before AMEND-2's intent wiring"
  - id: TAX-4
    law: "MATERIALIZABLE does not imply ROUTABLE"
    witness: "torus, ring"
  - id: TAX-5
    law: "canonical_id is not a backend spelling"
    witness: "concentrated_mesh/cmesh, custom/anynet, flattened_butterfly/ftree"
  - id: TAX-6
    law: "no enum-set comparison is a capability authority"
    witness: "this registry; check_topology_family_registry.py compares it against the enums"

amendments:
  - id: AMEND-1
    decision: "GEC and FAT_TREE stay RECOGNIZED and AUTHORABLE. A missing materializer does not delete a family from the taxonomy; _family_of() already refuses with a typed error."
    rejected: "remove GEC/FAT_TREE from declaration authority because they lack materializers"
    reason: "that rule collapses DECLARABLE and MATERIALIZABLE — the exact conflation the staged model exists to prevent"
  - id: AMEND-1b
    decision: "RING stays AUTHORABLE=NO with role TEST_FIXTURE."
    rejected: "add RING to declaration authority because it has a materializer"
    reason: "materializable does not imply declarable; RING is a minimal-graph fixture used only by tests"
  - id: AMEND-2
    decision: "custom topology intent is the EXISTING TopologyIR (undirected links, no coordinates required); add only the TopologyIR -> TopologyArtifact materializer."
    rejected: "a new ExplicitTopologyIntent requiring coordinates"
    reason: "TopologyIR already exists, is stricter, and does not require coordinates — requiring them would silently redefine 'custom topology' as '2D physical-layout topology'"
