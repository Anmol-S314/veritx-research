# Topology family registry — the stage authority for topology identity.
#
# WHY THIS FILE EXISTS
#
# The tree carries TWO enums that disagree:
#
#   TopologyFamily      MESH TORUS CONCENTRATED_MESH GEC FAT_TREE        (declaration)
#   MaterializedFamily  MESH TORUS CONCENTRATED_MESH RING                (materialization)
#
# Enum membership is NOT a capability statement. A family that is
# recognized is not thereby authorable; a family that is materializable is
# not thereby declarable. This registry is the single authority for the
# staged answer, and `scripts/check_topology_family_registry.py` fails
# closed if any enum and this file drift apart.
#
# THREE INDEPENDENT CONCEPTS (never collapsed):
#
#   taxonomy   — scientifically recognized topology identities
#   authorable — a canonical intent schema exists for it
#   material   — the compiler can lower it to a canonical TopologyArtifact
#
# A family may be in any subset. RING is the proof: materializable, not
# authorable, not a user-facing family.

schema_version: 1
registry_version: topo-fam-v1

#: The staged vocabulary. Every cell is one of these, and each is answered
#: independently — no stage may be inferred from another.
stages:
  - "RECOGNIZED"     # in the scientific taxonomy
  - "AUTHORABLE"     # a canonical intent schema accepts it
  - "MATERIALIZABLE" # lowers to TopologyArtifact
  - "ROUTABLE"       # a canonical route can be derived
  - "VERIFIABLE"     # attachment/route/CDG verification applies
  - "PROJECTABLE"    # a backend projection exists
  - "EXECUTABLE"     # the projection runs
  - "QUALIFIED"      # the run is qualified against an authority
  - "WIRED"          # reachable from the product

stage_values: ["YES", "NO", "PARTIAL", "CONDITIONAL"]

#: Roles a family can play. NONE of these implies AUTHORABLE.
roles:
  - USER_FAMILY       # a user may legitimately declare it
  - DERIVED_STRUCTURE # the compiler derives it internally
  - TEST_FIXTURE      # exists to exercise the compiler in tests
  - BACKEND_ONLY      # a backend spelling with no canonical intent
  - RESEARCH          # recognized, not product

families:

  mesh:
    canonical_id: mesh
    truth: [mesh]
    role: USER_FAMILY
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "YES", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "YES", WIRED: "YES"}
    intent_schema: "NocConfig.topology_family = mesh (params: radix, concentration)"
    materializer: "topology_artifact.materialize_family(MESH)"
    backend_projection: {booksim: mesh, astra: mesh}
    evidence: "certified preset dense-1b-16tiles; test_topology_artifact.py"

  torus:
    canonical_id: torus
    truth: [torus]
    role: USER_FAMILY
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "YES", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "YES", WIRED: "YES"}
    intent_schema: "CompileRequestV4 TorusIntent(side_length, concentration); shipped torus25 preset declares X↔Y blocking dependencies, deriving exactly two dateline VCs"
    materializer: "topology_artifact.materialize_family(TORUS)"
    backend_projection: {booksim: torus, astra: mesh}
    evidence: "The one-VC default is still INVALID on DEADLOCK_FREE. The product torus25 preset carries explicit X↔Y blocking dependencies; its odd-side two-VC request compiles with a PASS certificate, prepares under CERTIFIED_BOOKSIM_TORUS_DOR_XY_V1, executes on the fork with conservation, and passes qualify_native_torus_dor (test_torus_e2e_qualify.py). Even side lengths are refused because the fork randomizes midpoint ties and cannot produce a deterministic routing dump. The capability probe uses this shipped supported configuration; no VC count or dependency is silently inferred."
    note: "READY is bounded to the qualified native 2-VC DOR profile with odd side length and explicit torus25 dependency policy; one-VC and even-side torus remain typed refusals."

  concentrated_mesh:
    canonical_id: concentrated_mesh
    truth: [concentrated_mesh]
    role: USER_FAMILY
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "YES", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "YES", WIRED: "YES"}
    intent_schema: "NocConfig.topology_family = concentrated_mesh (params: concentration)"
    materializer: "topology_artifact.materialize_family(CONCENTRATED_MESH)"
    backend_projection: {booksim: cmesh, astra: mesh}
    evidence: "PHASE C LANDED: CERTIFIED_BOOKSIM_CMESH_DOR_XY_V1 (booksim2-fork+P2-cmesh-dor+prepared-v1, qualifier qualify_native_cmesh_dor, seat_capacity 4, use_noc_latency 0) is registered QUALIFIED with execution handler + test_booksim_cmesh_projection.py. select_booksim_profile() returns CMESH_DOR_PROFILE for CONCENTRATED_MESH DOR_XY designs. scripts/check_capability_truth.py derives these stages from the real selector."
    note: "RECONCILED (studio-reconciliation slice 2): PHASE A refusal text was stale after PHASE C landed; stages now derived from the live CMESH profile."

  ring:
    canonical_id: ring
    truth: []
    role: TEST_FIXTURE
    stages: {RECOGNIZED: "YES", AUTHORABLE: "NO", MATERIALIZABLE: "YES",
             ROUTABLE: "NO", VERIFIABLE: "YES", PROJECTABLE: "NO",
             EXECUTABLE: "NO", QUALIFIED: "NO", WIRED: "NO"}
    intent_schema: null
    materializer: "topology_artifact.materialize_family(RING)"
    backend_projection: {booksim: null, astra: Ring}
    evidence: "used by test_attachment.py, test_route_artifact.py, test_channel_vc_cdg.py, test_min_adapt_materialize.py, test_packet_format.py, test_topology_artifact.py"
    note: "AUTHORABLE=NO. Materializable does NOT imply declarable: RING is a
           minimal-graph fixture the compiler and CDG tests need. It is not
           user intent. This row is the explicit counterexample to
           'materializable families should be declarable'."

  gec:
    canonical_id: gec
    truth: [gec_mesh, gec_hybrid]
    role: RESEARCH
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "NO",
             ROUTABLE: "NO", VERIFIABLE: "NO", PROJECTABLE: "NO",
             EXECUTABLE: "NO", QUALIFIED: "NO", WIRED: "NO"}
    intent_schema: "GecTopologyIntent(mode, grid_side_length, concentration; mode-specific strict fields)"
    materializer: null
    backend_projection: {booksim: gec, astra: null}
    evidence: "TopologyFamily.GEC spans modes with different stages: MESH lowers exactly to the canonical MESH artifact and shipped gec_mesh64 runs under CERTIFIED_BOOKSIM_MESH_DOR_XY_V1; EXPRESS is point-to-point and product-wired through AnyNet; MULTIDROP and HYBRID remain typed refusals because their shared tapped-channel/VC semantics are not represented. See capability-archaeology.yaml GEC-MESH/GEC-EXPRESS/GEC-MECS/GEC-HYBRID."
    note: "Aggregate stages remain NO because this row requires every GEC mode to be supported; MESH and EXPRESS are separately unblocked, while MULTIDROP and HYBRID remain typed refusals."
    subfamilies:
      gec_express: {point_to_point: YES, note: "o=7,d=1: 7 express channels, each to 1 destination"}
      gec_mecs: {point_to_point: NO, note: "o=1,d=7: ONE express channel TAPPED to 7 destinations — multidrop, NOT representable as ordinary DirectedChannels without semantic loss"}
      gec_mesh: {point_to_point: YES, note: "o=0: degrades to plain mesh"}

  fat_tree:
    canonical_id: fat_tree
    truth: [fat_tree, fattree]
    role: USER_FAMILY
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "YES", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "YES", WIRED: "YES"}
    intent_schema: "FatTreeIntent(switch_radix, level_count) and structured fat_tree intent"
    materializer: "topology_artifact.materialize_topology_intent"
    backend_projection: {booksim: anynet, astra: null}
    evidence: "fat_tree4 and fattree16 presets compile to exact graph-backed CUSTOM artifacts, route via ANYNET_MIN_HOPS, and qualify under CERTIFIED_BOOKSIM_ANYNET_V1; fattree16 live BookSim execution preserves flit conservation."
    note: "The artifact's generic CUSTOM family is intentional: the authored family is retained in design identity and lowers to an exact graph, not to the distinct native BookSim fattree spelling."

  gec_mecs:
    canonical_id: gec_mecs
    truth: [gec_multidrop]
    role: RESEARCH
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "YES", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "YES", WIRED: "YES"}
    intent_schema: "GecTopologyIntent(mode=MULTIDROP, grid_side_length, concentration, groups, dests>=2)"
    materializer: "topology_artifact.materialize_gec_mecs"
    backend_projection: {booksim: gec, astra: null}
    evidence: "materialize_gec_mecs emits one SharedLink per (router, dimension, group) with GEC's non-directional tap order (ascending peer, self skipped) and no point-to-point channels at all; test_gec_mecs_materialize.py pins the wire count (2*o*k^2) and the tap in-degree, and cross-checks it against the differentially-qualified route artifact."
    note: "READY: renders under CERTIFIED_BOOKSIM_GEC_MECS_V1 and executes live with flit conservation and measured latency; the shipped gec_mecs16 preset normalizes to it. GEC-hybrid has a separate candidate-union rank proof and native runtime-choice profile; neither claims an escape role."

  gec_hybrid:
    canonical_id: gec_hybrid
    truth: [gec_hybrid]
    role: RESEARCH
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "YES", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "YES", WIRED: "YES"}
    intent_schema: "GecTopologyIntent(mode=HYBRID, grid_side_length, concentration, groups, dests>=2)"
    materializer: "topology_artifact.materialize_gec_hybrid"
    backend_projection: {booksim: gec, astra: null}
    evidence: "gec_hybrid16 compiles and certifies the complete mesh/MECS candidate union with actual resource/tap identities and strictly increasing dependency ranks. test_gec_hybrid_execution.py executes live with flit conservation, both runtime-selected modes, and mandatory credit-cost/port/tap/VC-range membership evidence."
    note: "READY for the representative 4x4, c=1, o=1, d=3, six-VC probe and shipped preset under CERTIFIED_BOOKSIM_GEC_HYBRID_V1. Exact 2*d phase/tap VCs, unit latency, one traffic class and canonical seat numbering are required; oversized envelopes (e.g. d=7 needs 14 VCs) retain typed refusal. This is a structural candidate-union rank proof, NOT an escape theorem or allocator/fairness/buffer-availability proof. Dirty-tree runs are not pinned release evidence."

  gec_express:
    canonical_id: gec_express
    truth: [gec_express]
    role: RESEARCH
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "YES", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "YES", WIRED: "YES"}
    intent_schema: "GecTopologyIntent(mode=EXPRESS, grid_side_length, concentration, groups=k-1, dests=1)"
    materializer: "topology_artifact.materialize_gec_express"
    backend_projection: {booksim: gec, astra: null}
    evidence: "MaterializedFamily.GEC_EXPRESS + source-law gate; routes via ANYNET_MIN_HOPS; shipped gec_express16 preset compiles and projects through the qualified AnyNet profile."
    note: "Point-to-point express is independently product-wired; multidrop/hybrid still require shared-resource semantics."

  srota:
    canonical_id: srota
    truth: [srota]
    role: RESEARCH
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "YES", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "YES", WIRED: "YES"}
    intent_schema: "SrotaIntent(side_length, concentration, mecs_row, mecs_col, drop_latency, planes, island_columns, path_shapes, vc_policy, sidebuf_enable, sidebuf_watermark, tel_period, tel_latency)"
    materializer: "topology_artifact.materialize_srota"
    backend_projection: {booksim: srota, astra: null}
    evidence: "The full fabrication chain RUNS: materialize_srota builds Plane D as a concentrated mesh plus MECS express channels carried as SharedLink (multidrop) objects (never flattened); the row-first hop rule is differentially qualified against the fork's executed realization (test_srota_rowfirst_differential.py); the v3 route's shared_resource_count equals the materializer's shared-link count; and the compiler certifies the design with DEADLOCK_FREE discharged by shared-resource-cdg/v1 (test_shared_resource_routing_stage.py). The row-first hop rule is derived in model/srota_rowfirst_route.py and DIFFERENTIALLY qualified against the fork's own executed realization (test_srota_rowfirst_differential.py), so derive_route now produces a RouteArtifactV3 whose shared_resource_count equals the materializer's shared-link count (test_shared_resource_routing_stage.py) and whose concrete (resource, vc) graph is acyclic (verify_shared_resource_deadlock)."
    note: "READY for the direct shapes and Valiant: the shipped srota32 preset (row-first) compiles, certifies (DEADLOCK_FREE via shared-resource-cdg/v1), renders under CERTIFIED_BOOKSIM_SROTA_ROW_FIRST_V1 and executes live with flit conservation (test_srota_backend_execution.py); the row+column pair renders under srota_vc_policy=shape (srota_path_en=3), the new srota32_rank preset adds Valiant under the hop-rank policy (4 VC sets, srota_path_en=7) with a rank union CDG, and srota32_islands carries QoS island columns as PLACEMENT with the colfirst island rule (the regulator's timing is not simulated). Plain dimensions and Plane C still refuse with typed reasons."

  flatfly:
    canonical_id: flatfly
    truth: [flatfly]
    role: USER_FAMILY
    stages: {RECOGNIZED: "YES", AUTHORABLE: "YES", MATERIALIZABLE: "YES",
             ROUTABLE: "YES", VERIFIABLE: "YES", PROJECTABLE: "YES",
             EXECUTABLE: "YES", QUALIFIED: "YES", WIRED: "PARTIAL"}
    intent_schema: null
    materializer: "topology_artifact.materialize_flatfly(k, n, concentration)"
    backend_projection: {booksim: flatfly, astra: null}
    evidence: "FLATFLY_MIN sealed class (lowest-dimension-first replica of min_flatfly) + _POLICY_BY_FAMILY; CERTIFIED_BOOKSIM_FLATFLY_MIN_V1 + qualify_native_flatfly_min QUALIFIED (v1 domain k-ary 2-fly, concentration 1); k=4/n=2 dump vs canonical table 256/256 COMPARABLE, 0 mismatches — derived end to end by capability truth. WIRED PARTIAL: inspectable + experimental use; no Studio execution entry yet."
    note: "FIRST NON-MESH PROOF FAMILY. Pure point-to-point: radix r=c+(k-1)*n,
           every router port is an ordinary channel. Requires NO new channel
           primitive. Chosen over GEC precisely because GEC-MECS is tapped."
    params: {k: 4, n: 2, c: 4}

  flattened_butterfly:
    canonical_id: flattened_butterfly
    truth: [flattened_butterfly]
    role: RESEARCH
    stages: {RECOGNIZED: "YES", AUTHORABLE: "NO", MATERIALIZABLE: "NO",
             ROUTABLE: "NO", VERIFIABLE: "NO", PROJECTABLE: "PARTIAL",
             EXECUTABLE: "NO", QUALIFIED: "NO", WIRED: "NO"}
