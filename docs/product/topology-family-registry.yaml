  qtree:
    canonical_id: qtree
    truth: [qtree]
    role: RESEARCH
    stages: {RECOGNIZED: "YES", AUTHORABLE: "NO", MATERIALIZABLE: "NO",
             ROUTABLE: "NO", VERIFIABLE: "NO", PROJECTABLE: "PARTIAL",
             EXECUTABLE: "NO", QUALIFIED: "NO", WIRED: "NO"}
    intent_schema: null
    materializer: null
    backend_projection: {booksim: qtree, astra: null}
