// Booksim 2.0 config: 4x4 mesh, hotspot traffic
// T2 Deadlock track — hotspot creates pressure
topology = mesh;
k = 4;
n = 4;
routing_function = dor;

num_vcs = 2;
vc_buf_size = 4;

traffic = hotspot;
hotspot_ratio = 0.05;
injection_rate = 0.05;
packet_size = 5;

sim_type = latency;
sample_period = 1000;
warmup_periods = 5;
