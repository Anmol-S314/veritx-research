topology = dragonflynew;

// NOTE: dragonfly CANNOT be configured for 16 nodes.
// Node formula: nodes = 2p²(2p²+1), where p = k.
// k=2 → p=2 → nodes = 2*4*(2*4+1) = 8*9 = 72  (minimum possible)
// k=3 → 342 nodes, k=4 → 1056 nodes
// This config produces a 72-node dragonfly — not comparable to 16-node topologies.
// Use a separately generated 72×72 traffic matrix for fair experiments.

k = 2;   // p=2, minimum dragonfly size

n = 1;   // must be 1 (hardcoded assert in source)

routing_function = min;
num_vcs = 2;  // min routing requires >= 2 VCs (source assert)

traffic = uniform;
injection_rate = 0.1;
num_vcs = 4; //2
vc_buf_size = 8;
packet_size = 5;

sim_type = latency;
sample_period = 1000;
warmup_periods = 3;