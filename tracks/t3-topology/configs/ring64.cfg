// 64-terminal ring: a one-dimensional torus. torus_64 is the BookSim
// spelling of a bidirectional ring with a wrap-around channel at each node.
topology = torus;
k = 64;
n = 1;
routing_function = dim_order;

num_vcs = 2;
vc_buf_size = 8;
packet_size = 5;
use_noc_latency = 0;

traffic = uniform;
injection_rate = 0.1;
sim_type = latency;
