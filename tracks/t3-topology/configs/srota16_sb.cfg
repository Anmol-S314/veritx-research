// Srota NoC -- full model: MECS express, O1TURN-XY with the Plane-T
// adaptive overlay, side-buffered Plane D router, and QoS islands.
// See third_party/booksim2/src/SROTA.md.
//
// Islands sit in columns 0 and 3 (TOPO_ISLAND_COL_MAP = 0b1001): the two
// edge columns, where HBM and UCIe attach (TOPO-003 4.3). Island-bound
// flows go column-first (srota_isl_route = colfirst), which makes I-ISL
// hold for every source outside an island column; the rank VC split keeps
// that shape mix deadlock-free (F1 passes at elaboration). The regulators
// run in accounting-only mode here (no srota_isl_rate) so the topology
// sweep compares fabrics, not QoS policies -- srota_features.py exercises them.
//
// 16 terminals (k=4, c=1) to match the 16x16 Timeloop traffic matrix.

topology = srota;
routing_function = o1turn;

k = 4;
c = 1;

srota_planes         = 5;   // D + T
srota_mecs           = 3;
srota_island_col_map = 9;   // columns 0 and 3
srota_isl_route      = colfirst;
srota_path_en        = 3;   // row-first + column-first, no Valiant
srota_vc_policy      = rank;// 2 rank sets: acyclic with both shapes live
srota_cong_thresh    = 8;
srota_epoch_len      = 1024;
srota_cdg_radix      = 4;

srota_router       = sidebuf;
num_vcs            = 2;     // one per rank set -- the price of RT-R7 + islands
vc_buf_size        = 2;     // staging latch per VC
srota_sb_depth     = 8;
srota_sb_watermark = 6;

use_noc_latency = 0;

traffic = uniform;
injection_rate = 0.1;
packet_size = 5;

sim_type = latency;
sample_period = 1000;
warmup_periods = 3;
