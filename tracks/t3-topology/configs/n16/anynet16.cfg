// GENERATED by scripts/gen_sweep_configs.py — template=anynet16.cfg size=n16
// Do not hand-edit; change the generator table and re-run.
topology = anynet;

// 16-node ring in anynet16.links (BookSim 'router <id> node <id>' syntax).
// Explicit rank count pins the ASTRA-Sim size so the adapter never has to
// guess from the links file (the counter also understands this format).
// total_nodes = 16;
// Resolved against the process cwd: all t3 flows run from $T3_DIR.
network_file = configs/anynet16.links;

// NOTE: BookSim appends '_<topology>' (routers/*_router.cpp), so this must be
// the short name 'min' -> 'min_anynet', not 'min_anynet' (which would form
// the invalid 'min_anynet_anynet').
routing_function = min;

traffic = uniform;
injection_rate = 0.1;

num_vcs = 4;
vc_buf_size = 8;
packet_size = 5;

sim_type = latency;
sample_period = 1000;
warmup_periods = 3;
