topology = cmesh;

// k^n * c = 2^2 * 4 = 16 nodes
// (c * k^n per networks/cmesh.cpp: _nodes = _c * powi(_k, _n))
total_nodes = 16;
k = 2;
n = 2;
c = 4;

x = 2;   // k (routers per x-dim)
y = 2;   // k (routers per y-dim)
xr = 2;  // sqrt(c) — concentration in x
yr = 2;  // sqrt(c) — concentration in y

routing_function = dor;

traffic = uniform;
injection_rate = 0.1;
num_vcs = 4;
vc_buf_size = 8;
packet_size = 5;

sim_type = latency; 
sample_period = 1000;
warmup_periods = 3;