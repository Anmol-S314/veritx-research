topology = cmesh;
k = 2;
n = 2;                   // 2x2 router grid...
c = 4;                   // ...with 4 nodes concentrated on each = 4 * 2^2 = 16 nodes
x = 2; y = 2;            // router grid dims
xr = 2; yr = 2;          // nodes per router, per axis. Booksim asserts c == xr*yr.
routing_function = dor_no_express;
num_vcs = 4;
vc_buf_size = 8;
traffic = uniform;
injection_rate = 0.1;
packet_size = 5;
sim_type = latency;
sample_period = 1000;
warmup_periods = 3;
