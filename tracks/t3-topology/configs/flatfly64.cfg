topology = flatfly;
k = 4;
n = 2;                   // 4x4 router grid...
c = 4;                   // ...4 nodes each = 4 * 4^2 = 64 nodes
x = 4; y = 4;
xr = 2; yr = 2;          // booksim asserts c == xr*yr
routing_function = ran_min;
num_vcs = 4;
vc_buf_size = 8;
traffic = uniform;
injection_rate = 0.1;
packet_size = 5;
sim_type = latency;
sample_period = 1000;
warmup_periods = 3;
