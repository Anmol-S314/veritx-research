// GEC-MECS 16 endpoints: 4x4 concentrator grid, c=1, one multidrop wire
// per (router, dimension, group), d=3 destinations per wire (o=1).
// Topology knobs mirror the canonical gec_mecs16 preset render; the sweep
// runner pins traffic/rate/VCs/buffers identically across every arm.
topology = gec;
k = 4;
c = 1;
o = 1;
d = 3;
mesh = 0;
routing_function = dor_gec;
routing_delay = 1;
use_noc_latency = 0;
num_vcs = 3;
router = iq;
priority = none;
