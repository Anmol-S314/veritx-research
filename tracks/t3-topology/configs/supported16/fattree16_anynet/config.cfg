// Canonical AnyNet projection for fattree16_anynet (16 endpoints), taken from the
// product render's topology.anynet. The sweep runner pins traffic/rate/VCs/
// buffers identically across every arm.
topology = anynet;
network_file = topology.anynet;
routing_function = min;
use_noc_latency = 0;
num_vcs = 2;
router = iq;
priority = none;
