// Srota NoC — concentrated mesh + MECS express, O1TURN-XY routing.
// See third_party/booksim2/src/SROTA.md for the model and its departures
// from the SSM-UARCH-* rev 0.3 specs.
//
// 16 terminals to match the rest of this directory and the 16x16 traffic
// matrix timeloop_to_matrix.py emits: k^2 * c = 4^2 * 1 = 16.
//
// num_vcs/vc_buf_size/packet_size are deliberately identical to
// mesh4x4.cfg and cmesh16.cfg so the sweep compares topologies, not
// buffer budgets.

topology = srota;
routing_function = o1turn;

k = 4;              // 4x4 concentrator routers
c = 1;              // 1 tile per router -> 16 terminals

srota_mecs        = 3;      // TOPO_MECS_ENABLE: row + column express
srota_path_en     = 3;      // row-first + column-first; no Valiant, so
                            // "rank" needs only 2 VC sets and 4 VCs go
                            // 2-per-set, matching the other configs
srota_vc_policy   = rank;   // deadlock-free with both shapes live
srota_cong_thresh = 8;
srota_epoch_len   = 1024;
srota_cdg_radix   = 4;      // F1 check runs at elaboration, every run

num_vcs = 4;
vc_buf_size = 8;

// REQUIRED: this model prices express channels at srota_drop_latency and
// mesh links at 1, and has no wire-length model, so it refuses
// use_noc_latency=1 rather than silently returning latency numbers that
// do not mean what was asked for.
//
// NOTE FOR COMPARISONS: the other configs in this directory do not set
// this, so they run at BookSim's default use_noc_latency=1. Add
// `use_noc_latency = 0;` to them before quoting a cross-topology latency
// number, or the arms are not measuring the same thing. Same caveat the
// GEC model already carries (third_party/booksim2/METADATA.json).
use_noc_latency = 0;

traffic = uniform;          // overridden by TRAFFIC_MATRIX in the spine
injection_rate = 0.1;
packet_size = 5;

sim_type = latency;
sample_period = 1000;
warmup_periods = 3;
