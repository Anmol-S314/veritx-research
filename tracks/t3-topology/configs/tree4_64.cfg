// BookSim tree4 (4-ary 3-tier) at 64 terminals. BookSim asserts k=4, n=3.
// Kept separate from qtree64 because the internal router wiring differs.
topology = tree4;

k = 4;   // hardcoded — cannot change
n = 3;   // hardcoded — cannot change

routing_function = nca;

traffic = uniform;
injection_rate = 0.1;
num_vcs = 4;
vc_buf_size = 8;
packet_size = 5;

sim_type = latency;
sample_period = 1000;
warmup_periods = 3; 