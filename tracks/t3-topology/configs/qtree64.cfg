// QTree (indirect 4-ary 3-tier tree) at 64 terminals. BookSim asserts k=4, n=3.
// The qtree16 name is historical; this config exposes 4^3 = 64 injection terminals.
topology = qtree;

k = 4;   // hardcoded — cannot change
n = 3;   // hardcoded — cannot change

routing_function = nca;

traffic = uniform;
injection_rate = 0.1;
num_vcs = 4;
vc_buf_size = 8;
packet_size = 5;

sim_type = latency;
sample_period = 1000;
warmup_periods = 3;