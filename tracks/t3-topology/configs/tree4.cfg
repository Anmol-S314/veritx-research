topology = tree4;

// _nodes = k^n = 4^3 = 64 (networks/tree4.cpp; k and n are hardcoded there)
// total_nodes = 64;
k = 4;   // hardcoded — cannot change
n = 3;   // hardcoded — cannot change

routing_function = nca;

traffic = uniform;
injection_rate = 0.1;
num_vcs = 4;
vc_buf_size = 8;
packet_size = 5;

sim_type = latency;
sample_period = 1000;
warmup_periods = 3; 