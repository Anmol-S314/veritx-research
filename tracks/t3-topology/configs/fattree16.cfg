topology = fattree;

// BookSim reports "# of nodes = 16" for k=4 fattree (real size: 2k² = 32
// endpoints; the sim exposes 16 host nodes). Pinned so the astrasim spine
// can build a matching logical topology without guessing.
total_nodes = 16;
k = 4;
n = 2;

routing_function =nca; //nca - deterministic & anca - adaptive

traffic = uniform;
injection_rate = 0.1;
num_vcs = 4;
vc_buf_size = 8;
packet_size = 5;

sim_type = latency;

sample_period = 1000;
warmup_periods = 3;
