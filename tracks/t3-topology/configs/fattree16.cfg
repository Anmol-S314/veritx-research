topology = fattree;
k = 4;
n = 2;                   // 4-ary 2-level fat tree = 4^2 = 16 nodes
routing_function = nca;  // nearest common ancestor (fattree's own; `dor` does not exist here)
num_vcs = 4;
vc_buf_size = 8;
traffic = uniform;
injection_rate = 0.1;
packet_size = 5;
sim_type = latency;
sample_period = 1000;
warmup_periods = 3;
