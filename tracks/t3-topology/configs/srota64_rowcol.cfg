// SROTA NoC at 64 terminals — concentrated mesh + MECS express, O1TURN-XY.
// Same model as configs/srota16.cfg, scaled from k=4 to k=8.  Used by the
// workload × topology trace ablation; keep the knob values aligned with that
// runner (packet_size, vc_buf_size, use_noc_latency, router pipeline).

topology = srota;
routing_function = o1turn;

k = 8;              // 8x8 concentrator routers
c = 1;              // 1 tile per router -> 64 terminals

srota_mecs        = 3;      // row + column express
srota_path_en     = 3;      // row-first + column-first; no Valiant
srota_vc_policy   = rank;   // deadlock-free with both shapes live
srota_cong_thresh = 8;
srota_epoch_len   = 1024;
srota_cdg_radix   = 4;      // abstraction radix for the F1 check

num_vcs = 4;
vc_buf_size = 8;

// This model prices express channels itself and refuses use_noc_latency=1.
use_noc_latency = 0;

packet_size = 5;
