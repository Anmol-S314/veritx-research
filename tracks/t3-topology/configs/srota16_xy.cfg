// Srota NoC -- the spec-literal Plane D: MECS express, pure XY routing,
// no VC arrays, 2-flit staging latch + shared 8-flit side buffer.
// See third_party/booksim2/src/SROTA.md ("Side buffer", "Planes").
//
// This is the one configuration that corresponds to a shippable Plane D
// as VC-002 rev 0.3 describes it: one VC (the staging latch is not a VC),
// one path shape (row-first = XY over MECS), so the CDG is acyclic with
// no VC help. No islands: the island routing rule is column-first, and on
// a zero-VC plane that mixes shapes and re-opens RT-R7 (srota16_sb.cfg
// carries islands on a VC-split plane instead).
//
// 16 terminals (k=4, c=1) to match the 16x16 Timeloop traffic matrix.

topology = srota;
routing_function = o1turn;

k = 4;
c = 1;

srota_planes    = 5;        // D + T (single-class sweep: C would sit idle)
srota_mecs      = 3;        // row + column express
srota_path_en   = 1;        // row-first only = XY over MECS
srota_vc_policy = none;     // no VC separation; acyclic because one shape
srota_cdg_radix = 4;        // F1 check at elaboration, every run

srota_router       = sidebuf;
num_vcs            = 1;     // Plane D carries no VC arrays (VC-002 2.1)
vc_buf_size        = 2;     // the staging latch (VC-002 2.2, fixed at 2)
srota_sb_depth     = 8;     // shared side buffer (VC-002 2.3)
srota_sb_watermark = 6;     // VC_SIDEBUF_WATERMARK reset value

use_noc_latency = 0;        // required; set for every arm via BOOKSIM_EXTRA

traffic = uniform;          // overridden by TRAFFIC_MATRIX in the spine
injection_rate = 0.1;
packet_size = 5;

sim_type = latency;
sample_period = 1000;
warmup_periods = 3;
