[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritx"
version = "0.3.0"
description = "Intent-to-fabric compiler for AI Network-on-Chip"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "VeritX Team"},
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
veritx = "veritx_dse.cli:main"

[tool.setuptools.packages.find]
include = ["veritx_dse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["veritx_dse"]
omit = ["veritx_dse/__pycache__/*"]
# parallel: subprocesses (python -m veritx_dse.cli ...) each write their own
# data file; `coverage combine` merges them. See tests/conftest.py.
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 50
