[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritx"
version = "0.3.0"
description = "Intent-to-fabric compiler for AI Network-on-Chip"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "VeritX Team"},
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
]

[project.scripts]
veritx = "veritx_dse.cli.cli:main"

[tool.setuptools.packages.find]
include = ["veritx_dse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "timeout: enforce a per-test wall-clock timeout (pytest-timeout)",
]
# A hung backend must fail the job, not stall CI (T4). Overridden per test.
timeout = 900

[tool.coverage.run]
source = ["veritx_dse"]
omit = ["veritx_dse/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
