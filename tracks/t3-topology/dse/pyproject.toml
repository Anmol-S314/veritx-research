[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritx"
version = "0.3.0"
description = "Intent-to-fabric compiler for AI Network-on-Chip"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
authors = [
    {name = "VeritX Team"},
]
dependencies = [
    "pydantic>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-optimize>=0.9",
    "pyyaml>=6.0",
]
# Verified-PRD Integrity PR A (§11): the declared range above must match the
# range actually tested (see .github/workflows + PR-A environment tests) and
# the interpreter floor enforced in veritx_dse.core.runs. uuid.uuid7 is
# implemented locally in core/runs.py precisely so 3.12/3.13 work.

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
veritx = "veritx_dse.cli:main"

[tool.setuptools.packages.find]
include = ["veritx_dse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["veritx_dse"]
omit = ["veritx_dse/__pycache__/*"]
# parallel: subprocesses (python -m veritx_dse.cli ...) each write their own
# data file; `coverage combine` merges them. See tests/conftest.py.
parallel = true

[tool.coverage.report]
show_missing = true
fail_under = 50
