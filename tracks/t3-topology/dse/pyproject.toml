[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritx"
version = "0.3.0"
description = "Intent-to-fabric compiler for AI Network-on-Chip"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.10"
authors = [
    {name = "VeritX Team"},
]
dependencies = [
    # Runtime surface actually imported by veritx_dse (non-test code).
    # Guarded by scripts/check_python_deps.py: an import without a
    # declaration fails product-gates; a declaration without an import
    # fails the REQUIRED_RUNTIME_SURFACE check.
    "pydantic>=2.0",      # core/spec.py, gateway request bodies
    "pyyaml",             # application/product_registry.py
    "fastapi",            # gateway/app.py (served via uvicorn per runbooks)
    "uvicorn",            # gateway server (DEMO-RUNBOOK, STUDIO-LIVE-ARCHITECTURE)
    "numpy",              # synthesis engines, tools (apt python3-numpy also satisfies)
    "scipy",              # synthesis/milp_topology_v2.py, tools/deadlock_routing.py
    "scikit-optimize",    # synthesis/bo_synthesizer.py (gp_minimize)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.2",
]

[project.scripts]
veritx = "veritx_dse.cli.cli:main"

[tool.setuptools.packages.find]
include = ["veritx_dse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "timeout: enforce a per-test wall-clock timeout (pytest-timeout)",
]
# A hung backend must fail the job, not stall CI (T4). Overridden per test.
timeout = 900

[tool.coverage.run]
source = ["veritx_dse"]
omit = ["veritx_dse/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 50
