# Minimal mapping: DRAM→GlobalBuffer→RegisterFile→MAC
# Temporal tiling at each level. Students design better mappings.
map:
  version: "0.4"
  targets:
    - target: DRAM
      type: temporal
      factors: [M=1, N=1, K=1]
      permutation: [M, N, K]
    - target: GlobalBuffer
      type: temporal
      factors: [M=4, N=4, K=1]
      permutation: [M, N, K]
    - target: RegisterFile
      type: temporal
      factors: [M=4, N=4, K=16]
      permutation: [M, N, K]
