problem:
  shape:
    name: gemm
    dimensions: [ M, N, K ]

    data-spaces:
      - name: Inputs
        projection:
          - [[M]]
          - [[K]]

      - name: Weights
        projection:
          - [[K]]
          - [[N]]

      - name: Outputs
        projection:
          - [[M]]
          - [[N]]
        read-write: True

  instance:
    M: 16
    N: 16
    K: 16