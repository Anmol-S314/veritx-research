problem:
  shape:
    name: cnn_layer
    dimensions: [R, S, P, Q, C, M]

    data-spaces:

      - name: Weights
        projection:
          - [[M]]
          - [[C]]
          - [[R]]
          - [[S]]

      - name: Inputs
        projection:
          - [[C]]
          - [[P], [R]]
          - [[Q], [S]]

      - name: Outputs
        projection:
          - [[M]]
          - [[P]]
          - [[Q]]
        read-write: True

  instance:
    R: 3
    S: 3
    P: 14
    Q: 14
    C: 32
    M: 64