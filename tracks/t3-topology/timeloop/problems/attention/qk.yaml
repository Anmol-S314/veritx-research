problem:
  shape:
    name: attention_qk
    dimensions: [B, H, M, N, D]

    data-spaces:

      - name: Queries
        projection:
          - [[B]]
          - [[H]]
          - [[M]]
          - [[D]]

      - name: Keys
        projection:
          - [[B]]
          - [[H]]
          - [[N]]
          - [[D]]

      - name: AttentionScores
        projection:
          - [[B]]
          - [[H]]
          - [[M]]
          - [[N]]
        read-write: True

  instance:
    B: 1
    H: 8
    M: 128
    N: 128
    D: 64