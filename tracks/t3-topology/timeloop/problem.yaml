# Attention projection GEMM: (M x K) . (K x N) = (M x N).
# The GEMM shape is defined inline (dims M,N,K; data-spaces A,B,Z) so this file
# is self-contained — no dependency on Timeloop's bundled problem-shapes/ dir.
# coefficients is omitted (optional; only needed for strided projections).
1:
  problem:
    shape:
      name: gemm
      dimensions: [ M, N, K ]
      data-spaces:
      - name: A
        projection:
        - [ [M] ]
        - [ [K] ]
      - name: B
        projection:
        - [ [N] ]
        - [ [K] ]
      - name: Z
        projection:
        - [ [M] ]
        - [ [N] ]
        read-write: True
    instance:
      M: 16
      N: 16
      K: 16

#A cnn layer / Conv2D operation


2:
  problem:
    shape:
      name: cnn_layer
      dimensions: [ R, S, P, Q, C, M ]
      data-spaces:
      - name: Weights
        projection:
        - [ [M] ]
        - [ [C] ]
        - [ [R] ]
        - [ [S] ]
      - name: Inputs
        projection:
        - [ [C] ]
        - [ [P], [R] ] # Wstride * P + R
        - [ [Q], [S] ] # Hstride * Q + S
      - name: Outputs
        projection:
        - [ [M] ]
        - [ [P] ]
        - [ [Q] ]
        read-write: True
    instance:
      R: 3 # Filter Height
      S: 3 # Filter Width
      P: 14 # Output Height
      Q: 14 # Output Width
      C: 64 # Input Channels
      M: 128 # Output Channels (Filters)

