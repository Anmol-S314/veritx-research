// VeritX: 4-NPU booksim2 fabric (2x2 mesh) for the ASTRA-sim backend.
// External injection only: injection_rate forced to 0 by booksim2-extra.
topology = mesh;
k = 2;
n = 2;
routing_function = dor;
num_vcs = 4;
vc_buf_size = 8;
wait_for_tail_credit = 1;
vc_allocator = islip;
sw_allocator = islip;
alloc_iters = 1;
credit_delay = 2;
routing_delay = 0;
vc_alloc_delay = 1;
sw_alloc_delay = 1;
input_speedup = 2;
output_speedup = 1;
internal_speedup = 1.0;
traffic = uniform;
packet_size = 4;
sim_type = latency;
injection_rate = 0.005;
