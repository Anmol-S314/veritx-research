nodes: 72
sources:
  - mode: uniform
    src: all
    dst: all
    duration: [0, 1000]
    count: 500
    packet_size: 16
    type: READ

  - mode: hotspot
    src: [0, 5, 15, 25, 35, 45]
    dst: 15
    duration: [0, 500]
    count: 20
    packet_size: 8
    type: WRITE

  - mode: burst
    src: 5
    dst: 9
    start: 100
    interval: 50
    burst_count: 10
    packet_size: 32
    type: WRITE

  - mode: hotspot
    src: all
    dst: 30
    duration: [200, 800]
    count: 100
    packet_size: 8
    type: READ
